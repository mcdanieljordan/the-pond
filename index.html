  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n  \n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>The Pond — BullFrogBuddy Beta Platform<\u002Ftitle>\n  <script src=\"137a1e04-e602-4abe-9935-b9321799739e\"><\u002Fscript>\n  <style>\n    * { margin: 0; padding: 0; box-sizing: border-box; }\n    body {\n      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n      background: linear-gradient(135deg, #0a1f1a 0%, #1a3a2a 100%);\n      color: #e8f5e9;\n      line-height: 1.6;\n    }\n    :root {\n      --lily: #4ade80;\n      --foam: #86efac;\n      --pond: #1a3a2a;\n      --depth: #0a1f1a;\n      --text-dim: #94a3a0;\n    }\n    /* LAYOUT */\n    #app { position: relative; z-index: 1; min-height: 100vh; }\n    /* LOGIN SCREEN */\n    #login-screen {\n      display: flex; flex-direction: column;\n      align-items: center; justify-content: center;\n      min-height: 100vh; padding: 2rem; text-align: center;\n    }\n    .pond-logo {\n      font-size: 5rem; margin-bottom: 1rem;\n      filter: drop-shadow(0 0 20px rgba(74,222,128,0.4));\n      animation: float 3s ease-in-out infinite;\n    }\n    @keyframes float {\n      0%,100% { transform: translateY(0); }\n      50% { transform: translateY(-10px); }\n    }\n    .pond-title {\n      font-size: 2.4rem; font-weight: 700; letter-spacing: -0.03em;\n      color: var(--lily); margin-bottom: 0.25rem;\n    }\n    .pond-sub {\n      font-size: 1rem; color: var(--text-dim); margin-bottom: 2.5rem;\n      letter-spacing: 0.05em;\n    }\n    .btn-google {\n      display: flex; align-items: center; gap: 0.75rem;\n      background: var(--foam); color: #1a3a2a;\n      font-size: 1rem; font-weight: 600;\n      padding: 0.85rem 2rem; border-radius: 50px;\n      border: none; cursor: pointer;\n      box-shadow: 0 4px 24px rgba(74,222,128,0.2);\n      transition: transform 0.15s, box-shadow 0.15s;\n    }\n    .btn-google:hover {\n      transform: translateY(-2px);\n      box-shadow: 0 8px 32px rgba(74,222,128,0.35);\n    }\n    .btn-google svg { width: 20px; height: 20px; }\n    /* DASHBOARD */\n    #dashboard { display: none; padding: 2rem; }\n    #dashboard.active { display: block; }\n    .header {\n      display: flex; justify-content: space-between; align-items: center;\n      margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(74,222,128,0.2);\n    }\n    .user-info { display: flex; align-items: center; gap: 1rem; }\n    .btn-logout {\n      background: rgba(74,222,128,0.1); color: var(--lily);\n      padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--lily);\n      cursor: pointer; font-weight: 600;\n      transition: all 0.2s;\n    }\n    .btn-logout:hover {\n      background: var(--lily); color: #1a3a2a;\n    }\n    .nav-tabs {\n      display: flex; gap: 1rem; margin-bottom: 2rem;\n      border-bottom: 1px solid rgba(74,222,128,0.2);\n    }\n    .nav-tab {\n      padding: 0.75rem 1.5rem; background: none; border: none;\n      color: var(--text-dim); cursor: pointer; font-weight: 600;\n      border-bottom: 2px solid transparent; transition: all 0.2s;\n    }\n    .nav-tab.active {\n      color: var(--lily); border-bottom-color: var(--lily);\n    }\n    .tab-content { display: none; }\n    .tab-content.active { display: block; }\n    .card {\n      background: rgba(26,58,42,0.6); border: 1px solid rgba(74,222,128,0.2);\n      border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem;\n    }\n    .card-title {\n      font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem;\n      color: var(--foam);\n    }\n    .card-desc {\n      color: var(--text-dim); font-size: 0.9rem; margin-bottom: 1rem;\n    }\n    .btn-primary {\n      background: var(--lily); color: #1a3a2a;\n      padding: 0.65rem 1.5rem; border-radius: 6px; border: none;\n      cursor: pointer; font-weight: 600; font-size: 0.95rem;\n      transition: all 0.2s;\n    }\n    .btn-primary:hover {\n      background: var(--foam); transform: translateY(-2px);\n    }\n    .form-group {\n      margin-bottom: 1rem;\n    }\n    .form-group label {\n      display: block; color: var(--lily); font-weight: 600;\n      margin-bottom: 0.4rem; font-size: 0.9rem;\n    }\n    .form-group input, .form-group select, .form-group textarea {\n      width: 100%; padding: 0.75rem; background: rgba(10,31,26,0.8);\n      border: 1px solid rgba(74,222,128,0.3); border-radius: 6px;\n      color: #e8f5e9; font-size: 0.95rem;\n      transition: border-color 0.2s;\n    }\n    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {\n      outline: none; border-color: var(--lily);\n      box-shadow: 0 0 8px rgba(74,222,128,0.2);\n    }\n    /* CLASS ACTIONS */\n    .card-actions {\n      display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem;\n    }\n    .btn-secondary {\n      background: rgba(74,222,128,0.1); color: var(--lily);\n      padding: 0.65rem 1.25rem; border-radius: 6px;\n      border: 1px solid rgba(74,222,128,0.4);\n      cursor: pointer; font-weight: 600; font-size: 0.95rem;\n      transition: all 0.2s;\n    }\n    .btn-secondary:hover { background: rgba(74,222,128,0.2); border-color: var(--lily); }\n    .btn-danger {\n      background: none; color: var(--text-dim);\n      padding: 0.65rem 1.25rem; border-radius: 6px;\n      border: 1px solid rgba(148,163,160,0.4);\n      cursor: pointer; font-weight: 600; font-size: 0.95rem;\n      transition: all 0.2s;\n    }\n    .btn-danger:hover { color: #fca5a5; border-color: #fca5a5; }\n    .edit-panel {\n      margin-top: 1.25rem; padding: 1.25rem;\n      background: rgba(10,31,26,0.5);\n      border: 1px solid rgba(74,222,128,0.25); border-radius: 8px;\n    }\n    .edit-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }\n    .archive-bar {\n      display: flex; justify-content: flex-end; margin-bottom: 1rem;\n    }\n    .btn-toggle-archived {\n      background: none; color: var(--text-dim);\n      border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem;\n      padding: 0.4rem 0.6rem; border-radius: 4px; transition: color 0.2s;\n    }\n    .btn-toggle-archived:hover { color: var(--lily); }\n    .card.is-archived { opacity: 0.65; border-style: dashed; }\n    .archived-tag {\n      display: inline-block; font-size: 0.7rem; font-weight: 700;\n      letter-spacing: 0.08em; text-transform: uppercase;\n      color: var(--text-dim); border: 1px solid rgba(148,163,160,0.4);\n      border-radius: 4px; padding: 0.1rem 0.45rem; margin-left: 0.6rem;\n      vertical-align: middle;\n    }\n    /* STUDENTS */\n    .student-panel {\n      margin-top: 1.25rem; padding-top: 1.25rem;\n      border-top: 1px solid rgba(74,222,128,0.2);\n    }\n    .student-form {\n      display: flex; gap: 0.75rem; align-items: flex-end;\n      margin-bottom: 1.25rem; flex-wrap: wrap;\n    }\n    .student-form .form-group { flex: 1 1 200px; margin-bottom: 0; }\n    .student-list { display: flex; flex-direction: column; gap: 0.5rem; }\n    .student-row {\n      display: flex; justify-content: space-between; align-items: center;\n      gap: 1rem; padding: 0.6rem 0.9rem;\n      background: rgba(10,31,26,0.6);\n      border: 1px solid rgba(74,222,128,0.15); border-radius: 6px;\n      font-size: 0.95rem;\n    }\n    .btn-remove {\n      background: none; color: var(--text-dim);\n      padding: 0.25rem 0.7rem; border-radius: 4px;\n      border: 1px solid rgba(148,163,160,0.4);\n      cursor: pointer; font-weight: 600; font-size: 0.8rem;\n      transition: all 0.2s;\n    }\n    .btn-remove:hover {\n      color: #fca5a5; border-color: #fca5a5;\n    }\n    .student-empty { color: var(--text-dim); font-size: 0.9rem; }\n    .student-row-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }\n    .student-name { overflow-wrap: anywhere; }\n    .student-block { display: flex; flex-direction: column; gap: 0.4rem; }\n    .student-edit {\n      display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;\n      padding: 0.6rem 0.9rem;\n      background: rgba(10,31,26,0.35);\n      border: 1px dashed rgba(74,222,128,0.3); border-radius: 6px;\n    }\n    .student-edit input {\n      flex: 1 1 160px; padding: 0.5rem 0.65rem;\n      background: rgba(10,31,26,0.8);\n      border: 1px solid rgba(74,222,128,0.3); border-radius: 6px;\n      color: #e8f5e9; font-size: 0.9rem;\n    }\n    .student-edit input:focus { outline: none; border-color: var(--lily); }\n    .btn-mini {\n      background: rgba(74,222,128,0.12); color: var(--lily);\n      padding: 0.35rem 0.8rem; border-radius: 4px;\n      border: 1px solid rgba(74,222,128,0.4);\n      cursor: pointer; font-weight: 600; font-size: 0.8rem;\n      transition: all 0.2s;\n    }\n    .btn-mini:hover { background: rgba(74,222,128,0.25); }\n    .student-toolbar {\n      display: flex; justify-content: space-between; align-items: center;\n      gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.9rem;\n    }\n    .student-count { font-size: 0.85rem; color: var(--text-dim); font-weight: 600; }\n    .toolbar-links { display: flex; gap: 0.4rem; flex-wrap: wrap; }\n    .bulk-panel {\n      margin-bottom: 1.25rem; padding: 1rem;\n      background: rgba(10,31,26,0.4);\n      border: 1px solid rgba(74,222,128,0.25); border-radius: 8px;\n    }\n    .bulk-panel textarea {\n      width: 100%; min-height: 110px; resize: vertical;\n      padding: 0.7rem; background: rgba(10,31,26,0.8);\n      border: 1px solid rgba(74,222,128,0.3); border-radius: 6px;\n      color: #e8f5e9; font-size: 0.9rem; font-family: inherit; line-height: 1.5;\n    }\n    .bulk-panel textarea:focus { outline: none; border-color: var(--lily); }\n    .bulk-hint {\n      font-size: 0.8rem; color: var(--text-dim);\n      margin: 0.5rem 0 0.75rem;\n    }\n    .bulk-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }\n    /* MIGRATION (hidden utility) */\n    #migrate-panel { display: none; }\n    #migrate-panel.active { display: block; }\n    .migrate-card { border-color: rgba(250,204,21,0.4); }\n    .migrate-card .card-title { color: #fde047; }\n    .btn-migrate {\n      background: #fde047; color: #1a3a2a;\n      padding: 0.65rem 1.5rem; border-radius: 6px; border: none;\n      cursor: pointer; font-weight: 600; font-size: 0.95rem;\n      transition: all 0.2s;\n    }\n    .btn-migrate:hover { background: #fef08a; transform: translateY(-2px); }\n    .btn-migrate:disabled {\n      opacity: 0.5; cursor: not-allowed; transform: none;\n    }\n    .migrate-log {\n      margin-top: 1rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n      font-size: 0.85rem; color: var(--text-dim);\n      white-space: pre-wrap; line-height: 1.5;\n    }\n    /* PASSPHRASE MODAL */\n    .modal-overlay {\n      display: none; position: fixed; inset: 0; z-index: 900;\n      background: rgba(10,31,26,0.85);\n      align-items: center; justify-content: center; padding: 1.5rem;\n    }\n    .modal-overlay.active { display: flex; }\n    .modal-card {\n      width: 100%; max-width: 420px;\n      background: var(--pond); border: 1px solid rgba(74,222,128,0.35);\n      border-radius: 12px; padding: 2rem;\n      box-shadow: 0 12px 48px rgba(0,0,0,0.45);\n    }\n    .modal-title {\n      font-size: 1.35rem; font-weight: 700; color: var(--foam);\n      margin-bottom: 0.5rem;\n    }\n    .modal-desc {\n      color: var(--text-dim); font-size: 0.9rem; margin-bottom: 1.5rem;\n    }\n    .modal-warn {\n      color: var(--foam); font-size: 0.85rem; font-weight: 600;\n      background: rgba(74,222,128,0.08);\n      border: 1px solid rgba(74,222,128,0.25);\n      border-radius: 6px; padding: 0.7rem 0.9rem; margin-bottom: 1.5rem;\n    }\n    .modal-error {\n      display: none; color: #fca5a5; font-size: 0.875rem;\n      font-weight: 600; margin-bottom: 1rem;\n    }\n    .modal-error.active { display: block; }\n    .modal-card .btn-primary { width: 100%; }\n    .modal-link {\n      display: block; width: 100%; margin-top: 0.9rem;\n      background: none; border: none; color: var(--text-dim);\n      font-size: 0.85rem; font-weight: 600; cursor: pointer;\n      text-decoration: underline; transition: color 0.2s;\n    }\n    .modal-link:hover { color: var(--lily); }\n    .pass-ack {\n      display: flex; gap: 0.6rem; align-items: flex-start;\n      margin-bottom: 1.25rem; font-size: 0.85rem; color: var(--text-dim);\n      line-height: 1.45;\n    }\n    .pass-ack input {\n      width: 18px; height: 18px; margin-top: 0.15rem;\n      accent-color: var(--lily); flex-shrink: 0; cursor: pointer;\n    }\n    .pass-ack label { cursor: pointer; }\n    .modal-hardwall {\n      display: none; font-size: 0.85rem; line-height: 1.5;\n      color: #fca5a5; background: rgba(252,165,165,0.08);\n      border: 1px solid rgba(252,165,165,0.3);\n      border-radius: 6px; padding: 0.8rem 0.9rem; margin-top: 1rem;\n    }\n    .modal-hardwall.active { display: block; }\n    .rotate-log {\n      margin-top: 1rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n      font-size: 0.8rem; color: var(--text-dim);\n      white-space: pre-wrap; line-height: 1.5;\n      max-height: 160px; overflow-y: auto;\n    }\n    .security-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem; }\n    .toast {\n      position: fixed; bottom: 1.5rem; right: 1.5rem;\n      background: rgba(26,58,42,0.95); border: 1px solid var(--lily);\n      color: var(--foam); padding: 1rem 1.5rem; border-radius: 8px;\n      z-index: 1000; animation: slideIn 0.3s ease-out;\n    }\n    @keyframes slideIn {\n      from { transform: translateX(400px); opacity: 0; }\n      to { transform: translateX(0); opacity: 1; }\n    }\n  <\u002Fstyle>\n<\u002Fhead>\n<body>\n  <div id=\"app\">\n    <div id=\"login-screen\">\n      <div class=\"pond-logo\">🐸<\u002Fdiv>\n      <h1 class=\"pond-title\">The Pond<\u002Fh1>\n      <p class=\"pond-sub\">BullFrogBuddy Beta Platform<\u002Fp>\n      <button class=\"btn-google\" onclick=\"signIn()\">\n        <svg viewBox=\"0 0 24 24\" fill=\"currentColor\">\n          <path d=\"M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z\"><\u002Fpath>\n          <path d=\"M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z\"><\u002Fpath>\n          <path d=\"M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z\"><\u002Fpath>\n          <path d=\"M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z\"><\u002Fpath>\n        <\u002Fsvg>\n        Sign in with Google\n      <\u002Fbutton>\n      <p id=\"auth-status\" style=\"margin-top:1.25rem;min-height:1.4em;max-width:34rem;font-size:0.9rem;color:var(--text-dim)\"><\u002Fp>\n      <p style=\"margin-top:2rem;font-size:0.7rem;letter-spacing:0.08em;color:rgba(148,163,160,0.5)\">BUILD 2026-09-08-B<\u002Fp>\n    <\u002Fdiv>\n\n    <div id=\"dashboard\">\n      <div class=\"header\">\n        <h1 class=\"pond-title\">The Pond<\u002Fh1>\n        <div class=\"user-info\">\n          <span id=\"user-name\"><\u002Fspan>\n          <button class=\"btn-logout\" onclick=\"signOut()\">Sign Out<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"nav-tabs\">\n        <button class=\"nav-tab active\" onclick=\"switchTab('dashboard')\">Dashboard<\u002Fbutton>\n        <button class=\"nav-tab\" onclick=\"switchTab('classes')\">Classes<\u002Fbutton>\n        <button class=\"nav-tab\" onclick=\"switchTab('apps')\">Apps<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div id=\"tab-dashboard\" class=\"tab-content active\">\n        <div class=\"card\">\n          <div class=\"card-title\">Welcome to The Pond<\u002Fdiv>\n          <div class=\"card-desc\">Your classroom management hub for Ribbit Rabbit, Leader Locator, and more.<\u002Fdiv>\n          <p>Phase 1 complete: Google OAuth ✓ | Class creation ✓ | Student roster ✓<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"card\">\n          <div class=\"card-title\">Encryption<\u002Fdiv>\n          <div class=\"card-desc\">\n            Your class and student names are encrypted with a key derived from your passphrase.\n            The key is held in this tab only — reloading or closing the tab locks it again.\n          <\u002Fdiv>\n          <div class=\"security-actions\">\n            <button class=\"btn-secondary\" onclick=\"openRotateModal()\">Change passphrase<\u002Fbutton>\n            <button class=\"btn-danger\" onclick=\"lockNow()\">Lock now<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"migrate-panel\">\n          <div class=\"card migrate-card\">\n            <div class=\"card-title\">Encrypt existing classes<\u002Fdiv>\n            <div class=\"card-desc\">\n              One-time backfill. Reads the old plaintext class name and grade level,\n              encrypts them with your current passphrase, and writes them to the encrypted columns.\n              Only touches rows that aren't encrypted yet, so it's safe to run more than once.\n            <\u002Fdiv>\n            <button class=\"btn-migrate\" id=\"migrate-btn\" onclick=\"migrateClasses()\">Run backfill<\u002Fbutton>\n            <div class=\"migrate-log\" id=\"migrate-log\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"tab-classes\" class=\"tab-content\">\n        <div class=\"card\">\n          <div class=\"card-title\">Bulk import students<\u002Fdiv>\n          <div class=\"card-desc\">\n            Download the roster template, fill it in (a spreadsheet app or an LLM chat both work),\n            then upload it here. Rows are matched to your classes by name — classes that don't exist\n            yet are created automatically.\n          <\u002Fdiv>\n          <div class=\"card-actions\" style=\"margin-top:0\">\n            <button class=\"btn-secondary\" onclick=\"downloadRosterTemplate()\">Download CSV template<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"bulk-panel\" style=\"margin-top:1rem;margin-bottom:0\">\n            <div class=\"form-group\" style=\"margin-bottom:0.75rem\">\n              <label for=\"rosterFile\">Filled-in roster (.csv)<\u002Flabel>\n              <input type=\"file\" id=\"rosterFile\" accept=\".csv,text/csv\">\n            <\u002Fdiv>\n            <div class=\"bulk-actions\">\n              <button class=\"btn-primary\" id=\"roster-import-btn\" onclick=\"bulkImportRoster()\">Import roster<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"migrate-log\" id=\"roster-import-log\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"card-title\">Create New Class<\u002Fdiv>\n          <form onsubmit=\"createClass(event)\">\n            <div class=\"form-group\">\n              <label>Class Name<\u002Flabel>\n              <input type=\"text\" id=\"className\" required=\"\" placeholder=\"e.g., Period 3 - Math\">\n            <\u002Fdiv>\n            <div class=\"form-group\">\n              <label>Grade Level<\u002Flabel>\n              <input type=\"text\" id=\"gradeLevel\" placeholder=\"e.g., 5th Grade\">\n            <\u002Fdiv>\n            <button type=\"submit\" class=\"btn-primary\">Create Class<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fdiv>\n        <div class=\"archive-bar\">\n          <button class=\"btn-toggle-archived\" id=\"archived-toggle\" onclick=\"toggleArchivedView()\">Show archived classes<\u002Fbutton>\n        <\u002Fdiv>\n        <div id=\"classes-list\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"tab-apps\" class=\"tab-content\">\n        <div class=\"card\">\n          <div class=\"card-title\">Ribbit Rabbit<\u002Fdiv>\n          <div class=\"card-desc\">Attendance tracking and soundboard<\u002Fdiv>\n          <button class=\"btn-primary\" onclick=\"launchApp('Ribbit_Rabbit_beta.html')\">Launch<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"card-title\">Leader Locator<\u002Fdiv>\n          <div class=\"card-desc\">Student XP and leadership badges<\u002Fdiv>\n          <button class=\"btn-primary\" onclick=\"launchApp('Leader_Locator_beta.html')\">Launch<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"modal-overlay\" id=\"passphrase-modal\">\n    <div class=\"modal-card\">\n      <div class=\"modal-title\" id=\"pass-title\">Enter your passphrase<\u002Fdiv>\n      <div class=\"modal-desc\" id=\"pass-desc\">This passphrase encrypts your student names.<\u002Fdiv>\n      <div class=\"modal-warn\" id=\"pass-warn\">Write it down — it cannot be recovered if lost.<\u002Fdiv>\n      <form onsubmit=\"submitPassphrase(event)\">\n        <div class=\"form-group\">\n          <label id=\"pass-label\">Passphrase<\u002Flabel>\n          <input type=\"password\" id=\"passphrase\" required=\"\" autocomplete=\"off\" placeholder=\"At least 8 characters\">\n        <\u002Fdiv>\n        <div class=\"form-group\" id=\"pass-confirm-group\" style=\"display:none\">\n          <label>Confirm passphrase<\u002Flabel>\n          <input type=\"password\" id=\"passphraseConfirm\" autocomplete=\"off\" placeholder=\"Re-enter it\">\n        <\u002Fdiv>\n        <div class=\"modal-error\" id=\"pass-error\"><\u002Fdiv>\n        <div class=\"pass-ack\" id=\"pass-ack-group\" style=\"display:none\">\n          <input type=\"checkbox\" id=\"pass-ack\">\n          <label for=\"pass-ack\">I understand that if I lose this passphrase, my student and class names cannot be recovered by anyone — not by support, not by a password reset. The data will be permanently unreadable.<\u002Flabel>\n        <\u002Fdiv>\n        <button type=\"submit\" class=\"btn-primary\" id=\"pass-submit\">Unlock<\u002Fbutton>\n        <button type=\"button\" class=\"modal-link\" id=\"pass-forgot\" onclick=\"showHardWall()\">Forgot your passphrase?<\u002Fbutton>\n        <div class=\"modal-hardwall\" id=\"pass-hardwall\">\n          <strong>There is no recovery.<\u002Fstrong> Your passphrase is never sent to the server — only a random salt is stored,\n          so nobody can derive your key or read your encrypted names without it. If it's lost, that data is gone for good.\n          You can still sign in and create new classes, but the old encrypted names will stay unreadable.\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"modal-overlay\" id=\"rotate-modal\">\n    <div class=\"modal-card\">\n      <div class=\"modal-title\">Change your passphrase<\u002Fdiv>\n      <div class=\"modal-desc\">\n        This re-encrypts every class and student name with your new passphrase. Don't close this tab while it runs.\n      <\u002Fdiv>\n      <form onsubmit=\"rotatePassphrase(event)\">\n        <div class=\"form-group\">\n          <label>Current passphrase<\u002Flabel>\n          <input type=\"password\" id=\"rotateCurrent\" required=\"\" autocomplete=\"off\">\n        <\u002Fdiv>\n        <div class=\"form-group\">\n          <label>New passphrase<\u002Flabel>\n          <input type=\"password\" id=\"rotateNew\" required=\"\" autocomplete=\"off\" placeholder=\"At least 8 characters\">\n        <\u002Fdiv>\n        <div class=\"form-group\">\n          <label>Confirm new passphrase<\u002Flabel>\n          <input type=\"password\" id=\"rotateConfirm\" required=\"\" autocomplete=\"off\">\n        <\u002Fdiv>\n        <div class=\"modal-warn\">Write the new one down — it cannot be recovered if lost.<\u002Fdiv>\n        <div class=\"modal-error\" id=\"rotate-error\"><\u002Fdiv>\n        <button type=\"submit\" class=\"btn-primary\" id=\"rotate-submit\">Re-encrypt &amp; Change<\u002Fbutton>\n        <button type=\"button\" class=\"modal-link\" onclick=\"closeRotateModal()\">Cancel<\u002Fbutton>\n        <div class=\"rotate-log\" id=\"rotate-log\"><\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <button id=\"diag-open\" onclick=\"toggleDiag()\" style=\"position:fixed;bottom:12px;right:12px;z-index:900;background:rgba(26,58,42,0.9);color:#86efac;border:1px solid rgba(74,222,128,0.35);border-radius:6px;padding:0.4rem 0.7rem;font-size:0.75rem;font-weight:600;cursor:pointer\">Diagnostics<\u002Fbutton>\n\n  <div id=\"diag-panel\" style=\"display:none;position:fixed;inset:auto 12px 52px 12px;max-width:760px;margin:0 auto;z-index:901;background:#06140f;border:1px solid rgba(74,222,128,0.35);border-radius:10px;padding:1rem;box-shadow:0 18px 60px rgba(0,0,0,0.6)\">\n    <div style=\"display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem\">\n      <strong style=\"color:#86efac;font-size:0.95rem\">Sign-in diagnostics<\u002Fstrong>\n      <span id=\"diag-verdict\" style=\"font-size:0.8rem;color:#94a3a0\"><\u002Fspan>\n      <span style=\"flex:1\"><\u002Fspan>\n      <button onclick=\"copyDiag()\" style=\"background:#4ade80;color:#0a1f1a;border:none;border-radius:5px;padding:0.35rem 0.7rem;font-size:0.75rem;font-weight:700;cursor:pointer\">Copy log<\u002Fbutton>\n      <button onclick=\"clearDiag()\" style=\"background:none;color:#94a3a0;border:1px solid rgba(148,163,160,0.4);border-radius:5px;padding:0.35rem 0.7rem;font-size:0.75rem;cursor:pointer\">Clear<\u002Fbutton>\n      <button onclick=\"toggleDiag()\" style=\"background:none;color:#94a3a0;border:none;font-size:1.1rem;cursor:pointer;line-height:1\">×<\u002Fbutton>\n    <\u002Fdiv>\n    <pre id=\"diag-log\" style=\"margin:0;max-height:42vh;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.72rem;line-height:1.5;color:#cbd5d1\"><\u002Fpre>\n    <p style=\"margin-top:0.6rem;font-size:0.7rem;color:#94a3a0\">Tokens are redacted. This log survives the Google redirect — hit “Copy log” after a failed sign-in and send it over.<\u002Fp>\n  <\u002Fdiv>\n\n  <div id=\"toast\"><\u002Fdiv>\n\n  <script>\n    // CONFIG\n    const SUPABASE_URL = 'https://aiczpuoskwzqtzvoomll.supabase.co';\n    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpY3pwdW9za3d6cXR6dm9vbWxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzczNjgsImV4cCI6MjEwNDQxMzM2OH0.ttZE_4PrGb7qCJjcOKdahv4lH02JrWR4BpePsXC4gpA';\n    const GOOGLE_CLIENT_ID = '893792288234-9jukpem4l4u0j5sjc06dbs81dcn849tt.apps.googleusercontent.com';\n\n    // DIAGNOSTICS — log survives the OAuth redirect via localStorage.\n    const DIAG_KEY = 'pond-diag-log';\n    const BUILD_ID = '2026-09-08-B';\n\n    function diagRead() {\n      try { return JSON.parse(localStorage.getItem(DIAG_KEY) || '[]'); } catch (e) { return []; }\n    }\n\n    function redact(str) {\n      return String(str).replace(/(access_token|refresh_token|provider_token|id_token|code)=([^&#\\s]+)/g,\n        (m, k, v) => `${k}=<${v.length} chars>`);\n    }\n\n    function diag(msg, extra) {\n      const line = {\n        t: new Date().toISOString().slice(11, 23),\n        m: redact(msg),\n        d: extra === undefined ? undefined : redact(typeof extra === 'string' ? extra : JSON.stringify(extra))\n      };\n      const log = diagRead();\n      log.push(line);\n      while (log.length > 250) log.shift();\n      try { localStorage.setItem(DIAG_KEY, JSON.stringify(log)); } catch (e) {}\n      console.log('[pond]', line.m, extra !== undefined ? extra : '');\n      renderDiag();\n    }\n\n    function renderDiag() {\n      const el = document.getElementById('diag-log');\n      if (!el) return;\n      el.textContent = diagRead()\n        .map(l => `${l.t}  ${l.m}${l.d ? '\\n          ' + l.d : ''}`)\n        .join('\\n');\n      el.scrollTop = el.scrollHeight;\n    }\n\n    function toggleDiag() {\n      const p = document.getElementById('diag-panel');\n      const open = p.style.display === 'none';\n      p.style.display = open ? 'block' : 'none';\n      if (open) renderDiag();\n    }\n\n    function openDiag() {\n      document.getElementById('diag-panel').style.display = 'block';\n      renderDiag();\n    }\n\n    function copyDiag() {\n      const txt = document.getElementById('diag-log').textContent;\n      navigator.clipboard.writeText(txt).then(\n        () => showToast('Diagnostic log copied.'),\n        () => showToast('Copy blocked — select the text manually.', 'error')\n      );\n    }\n\n    function clearDiag() {\n      try { localStorage.removeItem(DIAG_KEY); } catch (e) {}\n      renderDiag();\n    }\n\n    function diagVerdict(msg) {\n      const el = document.getElementById('diag-verdict');\n      if (el) el.textContent = msg;\n    }\n\n    // Environment snapshot, written before anything else can fail.\n    (function () {\n      let storageOk = false;\n      try { localStorage.setItem('pond-probe', '1'); localStorage.removeItem('pond-probe'); storageOk = true; } catch (e) {}\n      diag('--- page load, build ' + BUILD_ID);\n      diag('url', location.href);\n      diag('env', {\n        origin: location.origin,\n        path: location.pathname,\n        hasHash: !!location.hash,\n        hasQuery: !!location.search,\n        localStorage: storageOk,\n        cookies: navigator.cookieEnabled,\n        supabaseLib: typeof window.supabase,\n        ua: navigator.userAgent.slice(0, 90)\n      });\n      if (!storageOk) diag('FATAL: localStorage is blocked — no session can be stored (3rd-party cookie / privacy blocker?)');\n      if (typeof window.supabase === 'undefined') diag('FATAL: supabase-js did not load (CDN blocked?)');\n    })();\n\n    // detectSessionInUrl is OFF on purpose: we consume the OAuth redirect ourselves in\n    // consumeAuthRedirect() so a failure is visible instead of silently leaving the login screen.\n    let sb = null;\n    try {\n      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {\n        auth: {\n          flowType: 'implicit',\n          detectSessionInUrl: false,\n          persistSession: true,\n          autoRefreshToken: true,\n          storageKey: 'the-pond-auth'\n        }\n      });\n      diag('supabase client created', { project: SUPABASE_URL });\n    } catch (err) {\n      diag('FATAL: createClient failed', err.message);\n    }\n\n    // STATE\n    let currentUser = null;\n    let cryptoKey = null;\n    let cryptoSalt = null;   // Uint8Array, per-teacher, stored base64 in beta_profiles.crypto_salt\n    let isNewPassphrase = false;\n\n    // Written to the legacy plaintext columns so NOT NULL constraints still pass.\n    const PLAINTEXT_PLACEHOLDER = '[encrypted]';\n\n    // Decrypted class fields, kept in memory so the edit form can prefill without re-decrypting.\n    let classCache = {};\n    let showArchived = false;\n\n    // Decrypted student names by id, for edit prefill; archived-view state per class.\n    let studentCache = {};\n    let archivedStudentView = {};\n    const BULK_LIMIT = 200;\n\n    // ENCRYPTION (AES-GCM, key derived from teacher passphrase)\n    async function deriveKeyFromPassphrase(passphrase, salt) {\n      const material = await crypto.subtle.importKey(\n        'raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']\n      );\n      return crypto.subtle.deriveKey(\n        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },\n        material,\n        { name: 'AES-GCM', length: 256 },\n        false,\n        ['encrypt', 'decrypt']\n      );\n    }\n\n    // Loads the teacher's salt (creating one on first sign-in) and opens the passphrase modal.\n    async function initCryptoKey(user) {\n      const { data, error } = await sb\n        .from('beta_profiles')\n        .select('crypto_salt')\n        .eq('user_id', user.id)\n        .maybeSingle();\n\n      if (error) throw error;\n\n      if (data && data.crypto_salt) {\n        cryptoSalt = fromB64(data.crypto_salt);\n        isNewPassphrase = false;\n      } else {\n        cryptoSalt = crypto.getRandomValues(new Uint8Array(16));\n        isNewPassphrase = true;\n      }\n      openPassphraseModal();\n    }\n\n    function openPassphraseModal() {\n      const modal = document.getElementById('passphrase-modal');\n      document.getElementById('pass-title').textContent =\n        isNewPassphrase ? 'Create your passphrase' : 'Enter your passphrase';\n      document.getElementById('pass-desc').textContent = isNewPassphrase\n        ? 'This passphrase encrypts your student names. It never leaves this device.'\n        : 'Enter the passphrase you created to unlock your student names.';\n      document.getElementById('pass-warn').style.display = isNewPassphrase ? 'block' : 'none';\n      document.getElementById('pass-confirm-group').style.display = isNewPassphrase ? 'block' : 'none';\n      document.getElementById('pass-ack-group').style.display = isNewPassphrase ? 'flex' : 'none';\n      document.getElementById('pass-ack').checked = false;\n      document.getElementById('pass-forgot').style.display = isNewPassphrase ? 'none' : 'block';\n      document.getElementById('pass-hardwall').classList.remove('active');\n      document.getElementById('pass-error').classList.remove('active');\n      document.getElementById('passphraseConfirm').required = isNewPassphrase;\n      document.getElementById('pass-submit').textContent = isNewPassphrase ? 'Create & Continue' : 'Unlock';\n      document.getElementById('passphrase').placeholder = isNewPassphrase\n        ? 'At least 8 characters' : 'Your passphrase';\n      modal.classList.add('active');\n      document.getElementById('passphrase').focus();\n    }\n\n    function showPassError(msg) {\n      const el = document.getElementById('pass-error');\n      el.textContent = msg;\n      el.classList.add('active');\n    }\n\n    function showHardWall() {\n      document.getElementById('pass-hardwall').classList.add('active');\n    }\n\n    // Clears the key from memory; the tab is locked until the passphrase is re-entered.\n    function lockNow() {\n      cryptoKey = null;\n      classCache = {};\n      document.getElementById('classes-list').innerHTML = '';\n      isNewPassphrase = false;\n      openPassphraseModal();\n    }\n\n    async function submitPassphrase(e) {\n      e.preventDefault();\n      document.getElementById('pass-error').classList.remove('active');\n      const input = document.getElementById('passphrase');\n      const confirmInput = document.getElementById('passphraseConfirm');\n      const passphrase = input.value;\n\n      if (isNewPassphrase) {\n        if (passphrase.length < 8) return showPassError('Passphrase must be at least 8 characters.');\n        if (passphrase !== confirmInput.value) return showPassError('Passphrases do not match.');\n        if (!document.getElementById('pass-ack').checked) {\n          return showPassError('Please confirm you understand the passphrase cannot be recovered.');\n        }\n      }\n\n      try {\n        cryptoKey = await deriveKeyFromPassphrase(passphrase, cryptoSalt);\n        input.value = '';\n        confirmInput.value = '';\n\n        if (isNewPassphrase) {\n          const { error } = await sb.from('beta_profiles').upsert({\n            user_id: currentUser.id,\n            email: currentUser.email,\n            crypto_salt: toB64(cryptoSalt)\n          }, { onConflict: 'user_id' });\n          if (error) throw error;\n        } else if (!(await passphraseUnlocksData())) {\n          cryptoKey = null;\n          return showPassError('Incorrect passphrase. Please try again.');\n        }\n\n        document.getElementById('passphrase-modal').classList.remove('active');\n        await loadClasses();\n      } catch (err) {\n        console.error('Passphrase error:', err);\n        showPassError('Could not unlock: ' + err.message);\n      }\n    }\n\n    // Verifies the derived key against one existing encrypted class name, if any exist.\n    async function passphraseUnlocksData() {\n      const { data, error } = await sb\n        .from('classes')\n        .select('name_encrypted')\n        .eq('user_id', currentUser.id)\n        .not('name_encrypted', 'is', null)\n        .limit(1);\n\n      if (error || !data || !data.length) return true;  // nothing to check against yet\n      const payload = data[0].name_encrypted;\n      if (!payload || !payload.iv || !payload.data) return true;\n      try {\n        await crypto.subtle.decrypt(\n          { name: 'AES-GCM', iv: fromB64(payload.iv) }, cryptoKey, fromB64(payload.data)\n        );\n        return true;\n      } catch (err) {\n        return false;\n      }\n    }\n\n    function toB64(buf) {\n      return btoa(String.fromCharCode(...new Uint8Array(buf)));\n    }\n\n    function fromB64(str) {\n      return Uint8Array.from(atob(str), ch => ch.charCodeAt(0));\n    }\n\n    async function encryptWith(text, key) {\n      const iv = crypto.getRandomValues(new Uint8Array(12));\n      const data = await crypto.subtle.encrypt(\n        { name: 'AES-GCM', iv }, key, new TextEncoder().encode(text)\n      );\n      return { iv: toB64(iv), data: toB64(data) };\n    }\n\n    async function decryptWith(payload, key) {\n      const plain = await crypto.subtle.decrypt(\n        { name: 'AES-GCM', iv: fromB64(payload.iv) }, key, fromB64(payload.data)\n      );\n      return new TextDecoder().decode(plain);\n    }\n\n    async function encryptField(text) {\n      return encryptWith(text, cryptoKey);\n    }\n\n    async function decryptField(payload) {\n      if (!payload || !payload.iv || !payload.data) return '[no data]';\n      try {\n        return await decryptWith(payload, cryptoKey);\n      } catch (err) {\n        console.error('Decrypt error:', err);\n        return '[unable to decrypt]';\n      }\n    }\n\n    function escapeHtml(str) {\n      return String(str).replace(/[&<>\"']/g, ch => ({\n        '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;'\n      })[ch]);\n    }\n\n    // AUTH\n    function authStatus(msg, isError) {\n      const el = document.getElementById('auth-status');\n      if (!el) return;\n      el.textContent = msg || '';\n      el.style.color = isError ? '#fca5a5' : 'var(--text-dim)';\n      if (msg) console.log('[auth]', msg);\n    }\n\n    // Exact page URL, no query/hash — must match a Supabase Redirect URL entry.\n    function redirectUrl() {\n      return location.origin + location.pathname;\n    }\n\n    async function signIn() {\n      try {\n        if (!sb) {\n          authStatus('The Supabase library never loaded on this page. Open Diagnostics.', true);\n          return openDiag();\n        }\n        const target = redirectUrl();\n        localStorage.setItem('pond-signin-attempt', Date.now() + '|' + target);\n        diag('signIn clicked', { redirectTo: target });\n        authStatus('Redirecting to Google\\u2026');\n\n        // skipBrowserRedirect so the URL is logged before we leave the page.\n        const { data, error } = await sb.auth.signInWithOAuth({\n          provider: 'google',\n          options: { redirectTo: target, skipBrowserRedirect: true }\n        });\n        if (error) throw error;\n        if (!data || !data.url) throw new Error('Supabase returned no authorize URL');\n\n        diag('authorize url', data.url);\n        const flow = new URL(data.url).searchParams.get('flow_type')\n          || (data.url.includes('code_challenge') ? 'pkce' : 'implicit');\n        diag('flow detected', flow);\n\n        // If navigation is blocked, give the user a real link instead of a dead button.\n        const fallback = setTimeout(() => {\n          diag('navigation to Google did not happen within 2.5s');\n          const el = document.getElementById('auth-status');\n          el.innerHTML = 'The browser blocked the redirect. <a href=\"' + data.url +\n            '\" style=\"color:#4ade80;font-weight:700\">Continue to Google &rarr;<\u002Fa>';\n          el.style.color = '#fca5a5';\n        }, 2500);\n        window.addEventListener('pagehide', () => clearTimeout(fallback), { once: true });\n\n        window.location.assign(data.url);\n      } catch (err) {\n        diag('signIn failed', err.message);\n        authStatus('Sign in failed: ' + err.message, true);\n        openDiag();\n      }\n    }\n\n    // Turns the tokens Google/Supabase leave in the URL into a real session.\n    async function consumeAuthRedirect() {\n      const hash = new URLSearchParams(location.hash.replace(/^#\\/?/, ''));\n      const query = new URLSearchParams(location.search);\n      const strip = () => history.replaceState({}, document.title, location.pathname);\n      diag('redirect params', {\n        hashKeys: [...hash.keys()],\n        queryKeys: [...query.keys()],\n        storedSession: !!localStorage.getItem('the-pond-auth'),\n        pendingAttempt: localStorage.getItem('pond-signin-attempt') || null\n      });\n\n      const failure = hash.get('error_description') || hash.get('error')\n        || query.get('error_description') || query.get('error');\n      if (failure) {\n        strip();\n        const text = decodeURIComponent(failure).replace(/\\+/g, ' ');\n        diag('provider returned error', text);\n        authStatus('Google returned an error: ' + text, true);\n        openDiag();\n        return null;\n      }\n\n      const access_token = hash.get('access_token');\n      const refresh_token = hash.get('refresh_token');\n      if (access_token && refresh_token) {\n        diag('implicit tokens present, calling setSession');\n        const { data, error } = await sb.auth.setSession({ access_token, refresh_token });\n        strip();\n        if (error) {\n          diag('setSession rejected', error.message);\n          authStatus('Signed in with Google, but the session was rejected: ' + error.message, true);\n          openDiag();\n          return null;\n        }\n        diag('setSession ok', { user: data.session && data.session.user && data.session.user.email });\n        return data.session;\n      }\n      if (access_token && !refresh_token) {\n        strip();\n        diag('access_token with no refresh_token');\n        authStatus('Google sent a token with no refresh token. In Supabase, set the Site URL and Redirect URL to ' + redirectUrl(), true);\n        openDiag();\n        return null;\n      }\n\n      const code = query.get('code');\n      if (code) {\n        diag('pkce code present, exchanging');\n        const { data, error } = await sb.auth.exchangeCodeForSession(code);\n        strip();\n        if (error) {\n          diag('code exchange failed', error.message);\n          authStatus('Could not complete sign-in: ' + error.message, true);\n          openDiag();\n          return null;\n        }\n        diag('code exchange ok');\n        return data.session;\n      }\n      diag('no auth response in URL');\n      return null;\n    }\n\n    async function signOut() {\n      try {\n        await sb.auth.signOut();\n      } catch (err) {\n        showToast('Sign out failed: ' + err.message, 'error');\n      }\n    }\n\n    function resetToLoginScreen() {\n      currentUser = null;\n      cryptoKey = null;\n      cryptoSalt = null;\n      classCache = {};\n      studentCache = {};\n      document.getElementById('dashboard').classList.remove('active');\n      document.getElementById('login-screen').style.display = 'flex';\n      document.getElementById('passphrase-modal').classList.remove('active');\n      document.getElementById('classes-list').innerHTML = '';\n      authStatus('');\n    }\n\n    async function initAuth() {\n      renderDiag();\n      if (!sb) {\n        authStatus('The Supabase library never loaded on this page. Open Diagnostics.', true);\n        diagVerdict('library missing');\n        return openDiag();\n      }\n      // Was a sign-in started in the last 5 minutes? If so, this load is the return trip.\n      const attempt = (localStorage.getItem('pond-signin-attempt') || '').split('|');\n      const returning = attempt[0] && (Date.now() - Number(attempt[0]) < 300000);\n      if (returning) diag('this load looks like the return from Google', { requestedRedirect: attempt[1], actualUrl: location.origin + location.pathname });\n      if (returning && attempt[1] && attempt[1] !== location.origin + location.pathname) {\n        diag('MISMATCH: Google returned to a different URL than requested — Supabase fell back to its Site URL');\n      }\n\n      try {\n        let session = await consumeAuthRedirect();\n\n        if (!session) {\n          const { data, error } = await sb.auth.getSession();\n          if (error) {\n            diag('getSession error', error.message);\n            authStatus('Could not read your saved session: ' + error.message, true);\n          }\n          session = data && data.session;\n          diag('getSession result', { hasSession: !!session });\n        }\n\n        if (session) {\n          localStorage.removeItem('pond-signin-attempt');\n          diagVerdict('signed in');\n          await onSignedIn(session.user);\n        } else if (returning) {\n          diagVerdict('returned from Google with no usable session');\n          if (!document.getElementById('auth-status').textContent) {\n            authStatus('Google sent you back but no session arrived. Open Diagnostics and send me the log.', true);\n          }\n          openDiag();\n        } else {\n          diagVerdict('not signed in');\n        }\n\n        sb.auth.onAuthStateChange((event, s) => {\n          diag('auth event: ' + event, { hasSession: !!s });\n          if (event === 'SIGNED_OUT') return resetToLoginScreen();\n          if (s && s.user && !currentUser) onSignedIn(s.user);\n        });\n      } catch (err) {\n        console.error('Auth init error:', err);\n        diag('initAuth threw', err.message);\n        authStatus('Auth error: ' + (err.message || err), true);\n        openDiag();\n      }\n    }\n\n    async function onSignedIn(user) {\n      currentUser = user;\n      document.getElementById('login-screen').style.display = 'none';\n      document.getElementById('dashboard').classList.add('active');\n      document.getElementById('user-name').textContent = user.email;\n      try {\n        await initCryptoKey(user);   // loadClasses() runs once the passphrase unlocks\n      } catch (err) {\n        console.error('Crypto init error:', err);\n        diag('initCryptoKey failed — likely an RLS or missing-table problem on beta_profiles', err.message);\n        showToast('Could not load your encryption profile: ' + (err.message || err), 'error');\n        openDiag();\n      }\n    }\n\n    // CLASSES\n    async function createClass(e) {\n      e.preventDefault();\n      try {\n        const className = document.getElementById('className').value.trim();\n        const gradeLevel = document.getElementById('gradeLevel').value.trim();\n        if (!className) return;\n\n        const { data, error } = await sb.from('classes').insert({\n          user_id: currentUser.id,\n          name: PLAINTEXT_PLACEHOLDER,\n          grade_level: PLAINTEXT_PLACEHOLDER,\n          name_encrypted: await encryptField(className),\n          grade_level_encrypted: gradeLevel ? await encryptField(gradeLevel) : null\n        });\n\n        if (error) throw error;\n        showToast('Class created!');\n        document.getElementById('className').value = '';\n        document.getElementById('gradeLevel').value = '';\n        await loadClasses();\n      } catch (err) {\n        showToast('Error creating class: ' + err.message, 'error');\n      }\n    }\n\n    async function loadClasses() {\n      try {\n        let query = sb\n          .from('classes')\n          .select('*')\n          .eq('user_id', currentUser.id);\n\n        // Legacy rows may have archived = null, so treat null as not archived.\n        query = showArchived\n          ? query.eq('archived', true)\n          : query.or('archived.is.null,archived.eq.false');\n\n        const { data, error } = await query.order('created_at', { ascending: false });\n\n        if (error) throw error;\n\n        const list = document.getElementById('classes-list');\n\n        if (!data.length) {\n          list.innerHTML = showArchived\n            ? '<div class=\"card\"><div class=\"card-desc\">No archived classes.<\u002Fdiv><\u002Fdiv>'\n            : '<div class=\"card\"><div class=\"card-desc\">No classes yet — create one above.<\u002Fdiv><\u002Fdiv>';\n          return;\n        }\n\n        const cards = await Promise.all(data.map(async c => {\n          const name = await decryptField(c.name_encrypted);\n          const grade = c.grade_level_encrypted\n            ? await decryptField(c.grade_level_encrypted)\n            : '';\n          classCache[c.id] = { name, grade };\n\n          if (showArchived) {\n            return `\n          <div class=\"card is-archived\">\n            <div class=\"card-title\">${escapeHtml(name)}<span class=\"archived-tag\">Archived<\u002Fspan><\u002Fdiv>\n            <div class=\"card-desc\">Grade: ${escapeHtml(grade || 'N/A')}<\u002Fdiv>\n            <small>${new Date(c.created_at).toLocaleDateString()}<\u002Fsmall>\n            <div class=\"card-actions\">\n              <button class=\"btn-secondary\" onclick=\"restoreClass('${c.id}')\">Restore<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>`;\n          }\n\n          return `\n          <div class=\"card\">\n            <div class=\"card-title\">${escapeHtml(name)}<\u002Fdiv>\n            <div class=\"card-desc\">Grade: ${escapeHtml(grade || 'N/A')}<\u002Fdiv>\n            <small>${new Date(c.created_at).toLocaleDateString()}<\u002Fsmall>\n            <div class=\"card-actions\">\n              <button class=\"btn-primary\" id=\"toggle-${c.id}\" onclick=\"toggleStudents('${c.id}')\">Manage Students<\u002Fbutton>\n              <button class=\"btn-secondary\" onclick=\"toggleEditClass('${c.id}')\">Edit<\u002Fbutton>\n              <button class=\"btn-danger\" onclick=\"archiveClass('${c.id}')\">Archive<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"edit-panel\" id=\"edit-${c.id}\" style=\"display:none\">\n              <form onsubmit=\"saveClass(event, '${c.id}')\">\n                <div class=\"form-group\">\n                  <label>Class Name<\u002Flabel>\n                  <input type=\"text\" id=\"editName-${c.id}\" required>\n                <\u002Fdiv>\n                <div class=\"form-group\">\n                  <label>Grade Level<\u002Flabel>\n                  <input type=\"text\" id=\"editGrade-${c.id}\" placeholder=\"e.g., 5th Grade\">\n                <\u002Fdiv>\n                <div class=\"edit-actions\">\n                  <button type=\"submit\" class=\"btn-primary\">Save Changes<\u002Fbutton>\n                  <button type=\"button\" class=\"btn-danger\" onclick=\"toggleEditClass('${c.id}')\">Cancel<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fform>\n            <\u002Fdiv>\n            <div class=\"student-panel\" id=\"students-${c.id}\" style=\"display:none\">\n              <div class=\"student-toolbar\">\n                <span class=\"student-count\" id=\"student-count-${c.id}\"><\u002Fspan>\n                <div class=\"toolbar-links\">\n                  <button type=\"button\" class=\"btn-toggle-archived\" onclick=\"toggleBulkPanel('${c.id}')\" id=\"bulk-toggle-${c.id}\">Bulk add<\u002Fbutton>\n                  <button type=\"button\" class=\"btn-toggle-archived\" onclick=\"toggleArchivedStudents('${c.id}')\" id=\"sarchive-toggle-${c.id}\">Show archived<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"bulk-panel\" id=\"bulk-${c.id}\" style=\"display:none\">\n                <textarea id=\"bulkNames-${c.id}\" placeholder=\"Jordan M.&#10;Riley T.&#10;Sam K.\"><\u002Ftextarea>\n                <div class=\"bulk-hint\">One name per line, or separated by commas. Blank lines and duplicates already in this class are skipped.<\u002Fdiv>\n                <div class=\"bulk-actions\">\n                  <button type=\"button\" class=\"btn-primary\" onclick=\"bulkAddStudents('${c.id}')\">Add all<\u002Fbutton>\n                  <button type=\"button\" class=\"btn-danger\" onclick=\"toggleBulkPanel('${c.id}')\">Cancel<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <form class=\"student-form\" id=\"student-form-${c.id}\" onsubmit=\"addStudent(event, '${c.id}')\">\n                <div class=\"form-group\">\n                  <label>Student Name<\u002Flabel>\n                  <input type=\"text\" id=\"studentName-${c.id}\" required placeholder=\"e.g., Jordan M.\">\n                <\u002Fdiv>\n                <button type=\"submit\" class=\"btn-primary\">Add Student<\u002Fbutton>\n              <\u002Fform>\n              <div class=\"student-list\" id=\"student-list-${c.id}\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>`;\n        }));\n        list.innerHTML = cards.join('');\n      } catch (err) {\n        console.error('Load classes error:', err);\n      }\n    }\n\n    function toggleArchivedView() {\n      showArchived = !showArchived;\n      document.getElementById('archived-toggle').textContent =\n        showArchived ? '← Back to active classes' : 'Show archived classes';\n      loadClasses();\n    }\n\n    function toggleEditClass(classId) {\n      const panel = document.getElementById('edit-' + classId);\n      const open = panel.style.display === 'none';\n      if (open) {\n        const cached = classCache[classId] || { name: '', grade: '' };\n        document.getElementById('editName-' + classId).value = cached.name;\n        document.getElementById('editGrade-' + classId).value = cached.grade;\n        document.getElementById('students-' + classId).style.display = 'none';\n        document.getElementById('toggle-' + classId).textContent = 'Manage Students';\n      }\n      panel.style.display = open ? 'block' : 'none';\n    }\n\n    async function saveClass(e, classId) {\n      e.preventDefault();\n      try {\n        const name = document.getElementById('editName-' + classId).value.trim();\n        const grade = document.getElementById('editGrade-' + classId).value.trim();\n        if (!name) return;\n\n        const { error } = await sb.from('classes').update({\n          name: PLAINTEXT_PLACEHOLDER,\n          grade_level: PLAINTEXT_PLACEHOLDER,\n          name_encrypted: await encryptField(name),\n          grade_level_encrypted: grade ? await encryptField(grade) : null\n        }).eq('id', classId);\n\n        if (error) throw error;\n        showToast('Class updated!');\n        await loadClasses();\n      } catch (err) {\n        showToast('Error updating class: ' + err.message, 'error');\n      }\n    }\n\n    async function archiveClass(classId) {\n      const cached = classCache[classId];\n      const label = cached ? `\"${cached.name}\"` : 'this class';\n      if (!confirm(`Archive ${label}? Its students stay attached and you can restore it later.`)) return;\n      try {\n        const { error } = await sb.from('classes')\n          .update({ archived: true })\n          .eq('id', classId);\n\n        if (error) throw error;\n        showToast('Class archived.');\n        await loadClasses();\n      } catch (err) {\n        showToast('Error archiving class: ' + err.message, 'error');\n      }\n    }\n\n    async function restoreClass(classId) {\n      try {\n        const { error } = await sb.from('classes')\n          .update({ archived: false })\n          .eq('id', classId);\n\n        if (error) throw error;\n        showToast('Class restored.');\n        await loadClasses();\n      } catch (err) {\n        showToast('Error restoring class: ' + err.message, 'error');\n      }\n    }\n\n    // STUDENTS\n    async function toggleStudents(classId) {\n      const panel = document.getElementById('students-' + classId);\n      const btn = document.getElementById('toggle-' + classId);\n      const open = panel.style.display === 'none';\n      if (open) document.getElementById('edit-' + classId).style.display = 'none';\n      panel.style.display = open ? 'block' : 'none';\n      btn.textContent = open ? 'Hide Students' : 'Manage Students';\n      if (open) await loadStudents(classId);\n    }\n\n    async function loadStudents(classId) {\n      const list = document.getElementById('student-list-' + classId);\n      const archivedView = !!archivedStudentView[classId];\n      try {\n        const { data, error } = await sb\n          .from('beta_students')\n          .select('*')\n          .eq('class_id', classId)\n          .eq('archived', archivedView)\n          .order('created_at', { ascending: true });\n\n        if (error) throw error;\n\n        const countEl = document.getElementById('student-count-' + classId);\n        if (countEl) {\n          countEl.textContent = archivedView\n            ? `${data.length} archived`\n            : `${data.length} student${data.length === 1 ? '' : 's'}`;\n        }\n\n        if (!data.length) {\n          list.innerHTML = archivedView\n            ? '<div class=\"student-empty\">No archived students.<\u002Fdiv>'\n            : '<div class=\"student-empty\">No students yet.<\u002Fdiv>';\n          return;\n        }\n\n        const rows = await Promise.all(data.map(async s => {\n          const name = await decryptField(s.name_encrypted);\n          studentCache[s.id] = name;\n\n          if (archivedView) {\n            return `\n            <div class=\"student-row\">\n              <span class=\"student-name\">${escapeHtml(name)}<\u002Fspan>\n              <div class=\"student-row-actions\">\n                <button class=\"btn-mini\" onclick=\"restoreStudent('${s.id}', '${classId}')\">Restore<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>`;\n          }\n\n          return `\n            <div class=\"student-block\">\n              <div class=\"student-row\" id=\"srow-${s.id}\">\n                <span class=\"student-name\">${escapeHtml(name)}<\u002Fspan>\n                <div class=\"student-row-actions\">\n                  <button class=\"btn-mini\" onclick=\"toggleEditStudent('${s.id}')\">Edit<\u002Fbutton>\n                  <button class=\"btn-remove\" onclick=\"removeStudent('${s.id}', '${classId}')\">Remove<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"student-edit\" id=\"sedit-${s.id}\" style=\"display:none\">\n                <input type=\"text\" id=\"sname-input-${s.id}\">\n                <button class=\"btn-mini\" onclick=\"saveStudent('${s.id}', '${classId}')\">Save<\u002Fbutton>\n                <button class=\"btn-remove\" onclick=\"toggleEditStudent('${s.id}')\">Cancel<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>`;\n        }));\n        list.innerHTML = rows.join('');\n      } catch (err) {\n        console.error('Load students error:', err);\n        list.innerHTML = '<div class=\"student-empty\">Could not load students.<\u002Fdiv>';\n      }\n    }\n\n    function toggleArchivedStudents(classId) {\n      archivedStudentView[classId] = !archivedStudentView[classId];\n      const on = archivedStudentView[classId];\n      document.getElementById('sarchive-toggle-' + classId).textContent =\n        on ? '← Back to active' : 'Show archived';\n      document.getElementById('student-form-' + classId).style.display = on ? 'none' : 'flex';\n      if (on) document.getElementById('bulk-' + classId).style.display = 'none';\n      loadStudents(classId);\n    }\n\n    function toggleBulkPanel(classId) {\n      const panel = document.getElementById('bulk-' + classId);\n      const open = panel.style.display === 'none';\n      panel.style.display = open ? 'block' : 'none';\n      if (open) document.getElementById('bulkNames-' + classId).focus();\n    }\n\n    function toggleEditStudent(studentId) {\n      const row = document.getElementById('srow-' + studentId);\n      const edit = document.getElementById('sedit-' + studentId);\n      const open = edit.style.display === 'none';\n      if (open) {\n        const input = document.getElementById('sname-input-' + studentId);\n        input.value = studentCache[studentId] || '';\n        row.style.display = 'none';\n        edit.style.display = 'flex';\n        input.focus();\n      } else {\n        edit.style.display = 'none';\n        row.style.display = 'flex';\n      }\n    }\n\n    async function saveStudent(studentId, classId) {\n      try {\n        const name = document.getElementById('sname-input-' + studentId).value.trim();\n        if (!name) return;\n\n        const { error } = await sb.from('beta_students')\n          .update({ name_encrypted: await encryptField(name) })\n          .eq('id', studentId);\n\n        if (error) throw error;\n        showToast('Student updated.');\n        await loadStudents(classId);\n      } catch (err) {\n        showToast('Error updating student: ' + err.message, 'error');\n      }\n    }\n\n    async function bulkAddStudents(classId) {\n      const field = document.getElementById('bulkNames-' + classId);\n      try {\n        const names = field.value\n          .split(/[\\n,]/)\n          .map(n => n.trim())\n          .filter(Boolean);\n\n        if (!names.length) { showToast('Nothing to add.', 'error'); return; }\n        if (names.length > BULK_LIMIT) {\n          showToast(`That's ${names.length} names — limit is ${BULK_LIMIT} per paste.`, 'error');\n          return;\n        }\n\n        // Dedupe within the paste, then against names already in this class.\n        const seen = new Set();\n        const unique = names.filter(n => {\n          const k = n.toLowerCase();\n          if (seen.has(k)) return false;\n          seen.add(k);\n          return true;\n        });\n\n        const existing = await existingNamesFor(classId);\n        const toAdd = unique.filter(n => !existing.has(n.toLowerCase()));\n        const skipped
