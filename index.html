= unique.length - toAdd.length;\n\n        if (!toAdd.length) {\n          showToast('All of those are already in this class.', 'error');\n          return;\n        }\n\n        const rows = await Promise.all(toAdd.map(async name => ({\n          class_id: classId,\n          name_encrypted: await encryptField(name),\n          archived: false\n        })));\n\n        const { error } = await sb.from('beta_students').insert(rows);\n        if (error) throw error;\n\n        showToast(`Added ${toAdd.length} student${toAdd.length === 1 ? '' : 's'}${skipped ? `, skipped ${skipped} duplicate${skipped === 1 ? '' : 's'}` : ''}.`);\n        field.value = '';\n        document.getElementById('bulk-' + classId).style.display = 'none';\n        await loadStudents(classId);\n      } catch (err) {\n        showToast('Error adding students: ' + err.message, 'error');\n      }\n    }\n\n    // Encrypted names can't be compared server-side, so duplicates are checked\n    // by decrypting the class's current roster in the browser.\n    async function existingNamesFor(classId) {\n      const set = new Set();\n      const { data, error } = await sb\n        .from('beta_students')\n        .select('name_encrypted')\n        .eq('class_id', classId)\n        .eq('archived', false);\n      if (error || !data) return set;\n      for (const s of data) {\n        const name = await decryptField(s.name_encrypted);\n        if (name && !name.startsWith('[')) set.add(name.toLowerCase());\n      }\n      return set;\n    }\n\n    async function restoreStudent(studentId, classId) {\n      try {\n        const { error } = await sb.from('beta_students')\n          .update({ archived: false })\n          .eq('id', studentId);\n\n        if (error) throw error;\n        showToast('Student restored.');\n        await loadStudents(classId);\n      } catch (err) {\n        showToast('Error restoring student: ' + err.message, 'error');\n      }\n    }\n\n    async function addStudent(e, classId) {\n      e.preventDefault();\n      const input = document.getElementById('studentName-' + classId);\n      try {\n        const name = input.value.trim();\n        if (!name) return;\n\n        const nameEncrypted = await encryptField(name);\n\n        const { error } = await sb.from('beta_students').insert({\n          class_id: classId,\n          name_encrypted: nameEncrypted,\n          archived: false\n        });\n\n        if (error) throw error;\n        showToast('Student added!');\n        input.value = '';\n        await loadStudents(classId);\n      } catch (err) {\n        showToast('Error adding student: ' + err.message, 'error');\n      }\n    }\n\n    async function removeStudent(studentId, classId) {\n      try {\n        const { error } = await sb\n          .from('beta_students')\n          .update({ archived: true })\n          .eq('id', studentId);\n\n        if (error) throw error;\n        showToast('Student removed.');\n        await loadStudents(classId);\n      } catch (err) {\n        showToast('Error removing student: ' + err.message, 'error');\n      }\n    }\n\n    // BULK ROSTER IMPORT (CSV)\n    function csvEscape(v) {\n      v = String(v == null ? '' : v);\n      return /[\",\\n]/.test(v) ? '\"' + v.replace(/\"/g, '\"\"') + '\"' : v;\n    }\n\n    function downloadRosterTemplate() {\n      const header = ['First Name', 'Last Name (or initial)', 'Birthday (MM/DD/YYYY)', 'Class Name', 'Period', 'Age', 'Gender'];\n      const example = ['Jordan', 'M.', '04/12/2016', 'Period 3 - Math', '3', '10', 'M'];\n      const csv = [header, example].map(r => r.map(csvEscape).join(',')).join('\\r\\n');\n      const blob = new Blob([csv], { type: 'text/csv' });\n      const a = document.createElement('a');\n      a.href = URL.createObjectURL(blob);\n      a.download = 'student_roster_template.csv';\n      document.body.appendChild(a);\n      a.click();\n      a.remove();\n    }\n\n    // Minimal CSV parser — handles quoted fields with embedded commas/quotes.\n    function parseCSV(text) {\n      const rows = [];\n      let row = [], field = '', inQuotes = false;\n      for (let i = 0; i < text.length; i++) {\n        const c = text[i];\n        if (inQuotes) {\n          if (c === '\"') { if (text[i + 1] === '\"') { field += '\"'; i++; } else inQuotes = false; }\n          else field += c;\n        } else {\n          if (c === '\"') inQuotes = true;\n          else if (c === ',') { row.push(field); field = ''; }\n          else if (c === '\\n') { row.push(field); rows.push(row); row = []; field = ''; }\n          else if (c === '\\r') { /* skip */ }\n          else field += c;\n        }\n      }\n      if (field.length || row.length) { row.push(field); rows.push(row); }\n      return rows.filter(r => r.some(f => f.trim() !== ''));\n    }\n\n    async function getOrCreateClassMap() {\n      const { data, error } = await sb.from('classes')\n        .select('id, name_encrypted')\n        .eq('user_id', currentUser.id)\n        .or('archived.is.null,archived.eq.false');\n      if (error) throw error;\n      const map = new Map();\n      for (const c of data) {\n        const name = await decryptField(c.name_encrypted);\n        if (!name.startsWith('[')) map.set(name.toLowerCase(), c.id);\n      }\n      return map;\n    }\n\n    async function ensureClassId(map, className) {\n      const key = className.trim().toLowerCase();\n      if (map.has(key)) return map.get(key);\n      const { data, error } = await sb.from('classes').insert({\n        user_id: currentUser.id,\n        name: PLAINTEXT_PLACEHOLDER,\n        grade_level: PLAINTEXT_PLACEHOLDER,\n        name_encrypted: await encryptField(className.trim())\n      }).select('id').single();\n      if (error) throw error;\n      map.set(key, data.id);\n      return data.id;\n    }\n\n    function rosterLog(msg) {\n      const el = document.getElementById('roster-import-log');\n      el.textContent += (el.textContent ? '\\n' : '') + msg;\n    }\n\n    async function bulkImportRoster() {\n      if (!cryptoKey) { showToast('Unlock first.', 'error'); return; }\n      const fileInput = document.getElementById('rosterFile');\n      const file = fileInput.files[0];\n      if (!file) { showToast('Choose a CSV file first.', 'error'); return; }\n\n      const btn = document.getElementById('roster-import-btn');\n      document.getElementById('roster-import-log').textContent = '';\n      btn.disabled = true;\n\n      try {\n        const text = await file.text();\n        const rows = parseCSV(text);\n        if (!rows.length) throw new Error('File is empty.');\n\n        const header = rows[0].map(h => h.trim().toLowerCase());\n        const dataRows = rows.slice(1);\n        if (!dataRows.length) throw new Error('No student rows found below the header.');\n\n        const idx = {\n          first: header.findIndex(h => h.startsWith('first')),\n          last: header.findIndex(h => h.startsWith('last')),\n          birthday: header.findIndex(h => h.startsWith('birthday')),\n          className: header.findIndex(h => h.startsWith('class')),\n          period: header.findIndex(h => h.startsWith('period')),\n          age: header.findIndex(h => h.startsWith('age')),\n          gender: header.findIndex(h => h.startsWith('gender'))\n        };\n        if (idx.first === -1 || idx.className === -1) {\n          throw new Error('Could not find \"First Name\" and \"Class Name\" columns — use the downloaded template headers.');\n        }\n\n        const classMap = await getOrCreateClassMap();\n        const toInsert = [];\n        let skipped = 0;\n\n        for (let r = 0; r < dataRows.length; r++) {\n          const row = dataRows[r];\n          const first = (row[idx.first] || '').trim();\n          const last = idx.last > -1 ? (row[idx.last] || '').trim() : '';\n          const className = (row[idx.className] || '').trim();\n          const birthday = idx.birthday > -1 ? (row[idx.birthday] || '').trim() : '';\n          const period = idx.period > -1 ? (row[idx.period] || '').trim() : '';\n          const age = idx.age > -1 ? (row[idx.age] || '').trim() : '';\n          const gender = idx.gender > -1 ? (row[idx.gender] || '').trim() : '';\n\n          if (!first || !className) { skipped++; rosterLog(`– row ${r + 2}: missing first name or class name, skipped`); continue; }\n\n          try {\n            const classId = await ensureClassId(classMap, className);\n            const displayName = last ? `${first} ${last}` : first;\n            toInsert.push({\n              class_id: classId,\n              name_encrypted: await encryptField(displayName),\n              first_name_encrypted: await encryptField(first),\n              last_name_encrypted: last ? await encryptField(last) : null,\n              birthday_encrypted: birthday ? await encryptField(birthday) : null,\n              gender_encrypted: gender ? await encryptField(gender) : null,\n              age_encrypted: age ? await encryptField(age) : null,\n              period: period || null,\n              archived: false\n            });\n          } catch (rowErr) {\n            skipped++;\n            rosterLog(`✗ row ${r + 2} (${first} ${last}): ${rowErr.message}`);\n          }\n        }\n\n        if (!toInsert.length) { rosterLog('\\nNothing to import.'); return; }\n\n        const { error } = await sb.from('beta_students').insert(toInsert);\n        if (error) throw error;\n\n        rosterLog(`\\nImported ${toInsert.length} student${toInsert.length === 1 ? '' : 's'}${skipped ? `, skipped ${skipped}` : ''}.`);\n        showToast(`Imported ${toInsert.length} student${toInsert.length === 1 ? '' : 's'}.`);\n        fileInput.value = '';\n        await loadClasses();\n      } catch (err) {\n        rosterLog('Error: ' + err.message);\n        showToast('Import failed: ' + err.message, 'error');\n      } finally {\n        btn.disabled = false;\n      }\n    }\n\n    // PASSPHRASE ROTATION\n    function openRotateModal() {\n      if (!cryptoKey) { showToast('Unlock first.', 'error'); return; }\n      ['rotateCurrent', 'rotateNew', 'rotateConfirm'].forEach(id => {\n        document.getElementById(id).value = '';\n      });\n      document.getElementById('rotate-error').classList.remove('active');\n      document.getElementById('rotate-log').textContent = '';\n      document.getElementById('rotate-submit').disabled = false;\n      document.getElementById('rotate-modal').classList.add('active');\n    }\n\n    function closeRotateModal() {\n      document.getElementById('rotate-modal').classList.remove('active');\n    }\n\n    function rotateLog(msg) {\n      const el = document.getElementById('rotate-log');\n      el.textContent += (el.textContent ? '\\n' : '') + msg;\n      el.scrollTop = el.scrollHeight;\n    }\n\n    function showRotateError(msg) {\n      const el = document.getElementById('rotate-error');\n      el.textContent = msg;\n      el.classList.add('active');\n    }\n\n    // Collects every encrypted payload belonging to this teacher, including archived rows.\n    async function collectEncryptedRows() {\n      const { data: classes, error: cErr } = await sb\n        .from('classes')\n        .select('id, name_encrypted, grade_level_encrypted')\n        .eq('user_id', currentUser.id);\n      if (cErr) throw cErr;\n\n      const classIds = classes.map(c => c.id);\n      let students = [];\n      if (classIds.length) {\n        const { data, error: sErr } = await sb\n          .from('beta_students')\n          .select('id, name_encrypted')\n          .in('class_id', classIds);\n        if (sErr) throw sErr;\n        students = data;\n      }\n      return { classes, students };\n    }\n\n    async function rotatePassphrase(e) {\n      e.preventDefault();\n      document.getElementById('rotate-error').classList.remove('active');\n      document.getElementById('rotate-log').textContent = '';\n\n      const current = document.getElementById('rotateCurrent').value;\n      const next = document.getElementById('rotateNew').value;\n      const confirmVal = document.getElementById('rotateConfirm').value;\n\n      if (next.length < 8) return showRotateError('New passphrase must be at least 8 characters.');\n      if (next !== confirmVal) return showRotateError('New passphrases do not match.');\n      if (next === current) return showRotateError('New passphrase must be different from the current one.');\n\n      const btn = document.getElementById('rotate-submit');\n      btn.disabled = true;\n      const written = [];\n\n      try {\n        const oldKey = await deriveKeyFromPassphrase(current, cryptoSalt);\n        const newSalt = crypto.getRandomValues(new Uint8Array(16));\n        const newKey = await deriveKeyFromPassphrase(next, newSalt);\n\n        rotateLog('Reading encrypted rows…');\n        const { classes, students } = await collectEncryptedRows();\n\n        // Decrypt everything with the old key FIRST. Any failure here means the\n        // current passphrase is wrong, and nothing has been written yet.\n        const plan = [];\n        for (const c of classes) {\n          const item = { table: 'classes', id: c.id, patch: {}, prev: {} };\n          if (c.name_encrypted) {\n            const name = await decryptWith(c.name_encrypted, oldKey);\n            item.patch.name_encrypted = await encryptWith(name, newKey);\n            item.prev.name_encrypted = c.name_encrypted;\n          }\n          if (c.grade_level_encrypted) {\n            const grade = await decryptWith(c.grade_level_encrypted, oldKey);\n            item.patch.grade_level_encrypted = await encryptWith(grade, newKey);\n            item.prev.grade_level_encrypted = c.grade_level_encrypted;\n          }\n          if (Object.keys(item.patch).length) plan.push(item);\n        }\n        for (const s of students) {\n          if (!s.name_encrypted) continue;\n          const name = await decryptWith(s.name_encrypted, oldKey);\n          plan.push({\n            table: 'beta_students', id: s.id,\n            patch: { name_encrypted: await encryptWith(name, newKey) },\n            prev: { name_encrypted: s.name_encrypted }\n          });\n        }\n\n        rotateLog(`Re-encrypting ${plan.length} row${plan.length === 1 ? '' : 's'}…`);\n\n        for (const item of plan) {\n          const { error } = await sb.from(item.table).update(item.patch).eq('id', item.id);\n          if (error) throw new Error(`${item.table}/${item.id}: ${error.message}`);\n          written.push(item);\n        }\n\n        // Salt goes last: while it still points at the old passphrase, a failed\n        // run can be rolled back cleanly.\n        const { error: saltErr } = await sb.from('beta_profiles')\n          .update({ crypto_salt: toB64(newSalt) })\n          .eq('user_id', currentUser.id);\n        if (saltErr) throw new Error('salt update: ' + saltErr.message);\n\n        cryptoKey = newKey;\n        cryptoSalt = newSalt;\n        rotateLog('Done.');\n        showToast('Passphrase changed.');\n        closeRotateModal();\n        await loadClasses();\n      } catch (err) {\n        console.error('Rotation error:', err);\n        if (written.length) {\n          rotateLog(`Failed — rolling back ${written.length} row${written.length === 1 ? '' : 's'}…`);\n          let rollbackFailed = 0;\n          for (const item of written) {\n            const { error } = await sb.from(item.table).update(item.prev).eq('id', item.id);\n            if (error) rollbackFailed++;\n          }\n          rotateLog(rollbackFailed\n            ? `Rollback incomplete: ${rollbackFailed} row(s) still hold new-key data. Do NOT change the passphrase again — tell Claude.`\n            : 'Rollback complete. Your old passphrase still works.');\n        }\n        showRotateError(err.name === 'OperationError'\n          ? 'Current passphrase is incorrect.'\n          : 'Could not change passphrase: ' + err.message);\n      } finally {\n        document.getElementById('rotate-submit').disabled = false;\n      }\n    }\n\n    // MIGRATION (one-time client-side backfill; needs an unlocked cryptoKey)\n    function migrateLog(msg) {\n      const el = document.getElementById('migrate-log');\n      el.textContent += (el.textContent ? '\\n' : '') + msg;\n    }\n\n    async function migrateClasses() {\n      const btn = document.getElementById('migrate-btn');\n      document.getElementById('migrate-log').textContent = '';\n\n      if (!cryptoKey) {\n        migrateLog('Locked — unlock with your passphrase first.');\n        return;\n      }\n\n      btn.disabled = true;\n      try {\n        const { data, error } = await sb\n          .from('classes')\n          .select('id, name, grade_level')\n          .eq('user_id', currentUser.id)\n          .is('name_encrypted', null);\n\n        if (error) throw error;\n\n        if (!data.length) {\n          migrateLog('Nothing to migrate — all classes are already encrypted.');\n          return;\n        }\n\n        migrateLog(`Found ${data.length} unencrypted class${data.length === 1 ? '' : 'es'}.`);\n        let done = 0, failed = 0;\n\n        for (const row of data) {\n          const label = row.name || '(no name)';\n          try {\n            if (!row.name || row.name === PLAINTEXT_PLACEHOLDER) {\n              migrateLog(`– skipped ${row.id}: no plaintext name to migrate`);\n              continue;\n            }\n            const patch = {\n              name_encrypted: await encryptField(row.name),\n              grade_level_encrypted: row.grade_level && row.grade_level !== PLAINTEXT_PLACEHOLDER\n                ? await encryptField(row.grade_level)\n                : null,\n              name: PLAINTEXT_PLACEHOLDER,\n              grade_level: PLAINTEXT_PLACEHOLDER\n            };\n            const { error: upErr } = await sb.from('classes').update(patch).eq('id', row.id);\n            if (upErr) throw upErr;\n            done++;\n            migrateLog(`✓ ${label}`);\n          } catch (rowErr) {\n            failed++;\n            migrateLog(`✗ ${label}: ${rowErr.message}`);\n          }\n        }\n\n        migrateLog(`\\nDone. ${done} encrypted${failed ? `, ${failed} failed` : ''}.`);\n        if (done) await loadClasses();\n      } catch (err) {\n        migrateLog('Migration error: ' + err.message);\n      } finally {\n        btn.disabled = false;\n      }\n    }\n\n    // TABS\n    function switchTab(tabName) {\n      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));\n      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));\n      document.getElementById('tab-' + tabName).classList.add('active');\n      event.target.classList.add('active');\n    }\n\n    // APPS\n    function launchApp(filename) {\n      window.open(filename, '_blank');\n    }\n\n    // TOAST\n    function showToast(msg, type = 'success') {\n      const toast = document.getElementById('toast');\n      toast.textContent = msg;\n      toast.style.display = 'block';\n      setTimeout(() => toast.style.display = 'none', 3000);\n    }\n\n    // INIT\n    window.addEventListener('DOMContentLoaded', () => {\n      if (location.hash === '#migrate') {\n        document.getElementById('migrate-panel').classList.add('active');\n      }\n      initAuth();\n    });\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
