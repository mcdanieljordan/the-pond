      <td>${t.custom?`<button class="btn warn" onclick="delTest('${t.id}')">🗑</button>`:''}</td></tr>`).join('')}</table></div>
    <h3 style="margin-top:16px">＋ Add custom test</h3>
    <div class="row wrap"><input type="text" id="ct-name" placeholder="e.g. Vertical jump"><select id="ct-type" onchange="$('#ct-sec').classList.toggle('hide',this.value!=='timed_reps')">${Object.entries(TYPE_INFO).map(([k,v])=>opt(k,v.label,'inarow_reps')).join('')}</select>
      <input type="text" id="ct-unit" placeholder="unit (reps, in, sec, m)" style="width:170px"><input type="number" id="ct-sec" class="hide" placeholder="seconds" value="30" style="width:120px">
      <select id="ct-att">${[1,2,3].map(n=>opt(n,n+' attempt'+(n>1?'s':''),3)).join('')}</select><select id="ct-score">${Object.entries(SCORING).map(([k,l])=>opt(k,l,'best')).join('')}</select>
      <button class="btn go" onclick="addTest()">Add test</button></div></div>
  <!-- COURSE -->
  <div class="card"><h2>Lap course</h2><div class="row wrap"><div class="seg">${[['15','15 m'],['20','20 m'],['custom','Custom'],['loop','Loop']].map(([m,l])=>`<button class="${S.course.mode===m?'on':''}" onclick="DB.settings.course.mode='${m}';saveSettings();pzBuild();renderSettings()">${l}</button>`).join('')}</div>
    <label class="row">Custom runway <input type="number" value="${esc(S.course.custom)}" style="width:100px" onchange="DB.settings.course.custom=+this.value||20;saveSettings();pzBuild()"> m</label>
    <label class="row">Loop <input type="number" value="${esc(S.course.loop)}" style="width:110px" onchange="DB.settings.course.loop=+this.value||400;saveSettings()"> m</label></div></div>
  <!-- XP LEVELS -->
  <div class="card"><h2>Levels</h2><p class="muted small">One name per line. A new level every ${XPCFG.xpPerLevel} XP. First result ${XPCFG.firstResultXP} XP; later results ${XPCFG.firstResultXP} + (% improvement × ${XPCFG.improvementMultiplier}); first time in HFZ +${XPCFG.hfzBonus}.</p>
    <textarea id="lvl-names" style="font-family:inherit;font-size:1em">${esc(levelNames().join('\n'))}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn go" onclick="DB.settings.levelNames=$('#lvl-names').value.split('\\n').map(s=>s.trim()).filter(Boolean);saveSettings();toast('Levels saved')">Save levels</button>
    <button class="btn" onclick="DB.settings.levelNames=null;saveSettings();renderSettings()">Reset</button></div></div>
  <!-- SCHOOL YEAR + SLIDESHOW -->
  <div class="card row wrap"><label class="row">School year <input type="text" value="${esc(S.schoolYear)}" style="width:140px" onchange="DB.settings.schoolYear=this.value.trim()||curSY();saveSettings()"></label>
    <label class="row">Slideshow speed <input type="range" min="80" max="600" step="20" value="${S.frameMs}" oninput="DB.settings.frameMs=+this.value;startTicker()" onchange="saveSettings()"> <span class="muted small">faster ← → slower</span></label></div>
  <!-- THEME -->
  <div class="card"><h2>Theme</h2><div id="theme-mount"></div></div>`;
  try{ window.BFT_THEME && BFT_THEME.renderPicker($('#theme-mount')); }catch{}
}
function setTestOpt(id, k, v){ const t=DB.tests[id];
  if(t){ if(k==='hidden'){ t.config=Object.assign({},t.config,{hidden:v}); } else t[k]=v; q('fitness_tests',id,t); save(); }
  else { DB.settings.testOverrides[id]=Object.assign({},DB.settings.testOverrides[id],{[k]:v}); saveSettings(); } renderSettings(); }
function addTest(){ const name=$('#ct-name').value.trim(); if(!name) return toast('Give the test a name', true); const type=$('#ct-type').value;
  const id=uid(), row={id, user_id:user.id, name, test_type:type, unit:$('#ct-unit').value.trim()||TYPE_INFO[type].unit, direction:TYPE_INFO[type].dir,
    attempts:+$('#ct-att').value, scoring:$('#ct-score').value, config: type==='timed_reps'?{seconds:+$('#ct-sec').value||30}:{}, sort:customTests().length, deleted:false};
  DB.tests[id]=row; q('fitness_tests',id,row); save(); renderSettings(); toast(name+' added'); }
function delTest(id){ if(!confirm('Delete this custom test? Its results stay saved but hidden.')) return; DB.tests[id].deleted=true; q('fitness_tests',id,DB.tests[id]);
  if(user.local) delete DB.tests[id]; save(); renderSettings(); }
function exportBackup(){ download(`GrowGrit_backup_${localISO()}.json`, JSON.stringify(DB), 'application/json'); }
</script>
</body>
</html>
