document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 1; } 100% { opacity: 0; } }\n  @keyframes bfbFade { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes bfbSwing { 0%, 100% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } }\n  @keyframes bfbClap { 0%, 100% { transform: translateX(-13px); } 50% { transform: translateX(13px); } }\n  @keyframes bfbShake { 0%, 100% { transform: translate(-5px, 0) rotate(-3deg); } 50% { transform: translate(5px, 0) rotate(3deg); } }\n  @keyframes bfbRipple { 0% { transform: scale(0.5); opacity: 0.9; } 100% { transform: scale(1.6); opacity: 0; } }\n  @keyframes bfbGlow { 0%, 100% { opacity: 0.3; transform: scaleY(0.94); } 50% { opacity: 1; transform: scaleY(1); } }\n  @keyframes bfbTick { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }\n  #bfbPrint { position: absolute; left: -10000px; top: 0; width: 7.5in; }\n  @media print {\n    body { background: #fff !important; }\n    body > * { display: none !important; }\n    #bfbPrintHost { display: block !important; }\n    #bfbPrint { position: static !important; left: 0 !important; width: auto !important; }\n    @page { margin: 0.4in; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ authLoading }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F4EC;\">\n    <div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 700; color: #5C6B60;\">Loading BullFrogBuddy…<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ authSignedOut }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0E4A2F; padding: 24px;\">\n    <div style=\"width: min(400px, 100%); background: #FFFFFF; border-radius: 18px; padding: 32px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center;\">\n      <div style=\"font-size: 11px; font-weight: 700; le -align: center;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onTimerToggle }}\" style=\"min-height: 34px; padding: 0 14px; border-radius: 999px; border: none; background: #F7C24B; color: #3E2C05; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer;\" style-hover=\"background: #FFD46B;\">{{ timerBtn }}<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ onTimerReset }}\" aria-label=\"Reset timer\" style=\"min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid rgba(244,250,244,0.3); background: transparent; color: #F4FAF4; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,0.14);\">Reset<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ onToggleBigTimer }}\" title=\"Show the timer full screen\" style=\"display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid rgba(244,250,244,0.3); background: transparent; color: #F4FAF4; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,0.14);\">\n            <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 15px; height: 15px;\"><path d=\"M4 10V4h6M20 14v6h-6M4 4l7 7M20 20l-7-7\" stroke=\"#A8D84C\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            Enlarge\n          <\u002Fbutton>\n          <sc-raw-select value=\"{{ alarmSound }}\" sc-camel-on-change=\"{{ onAlarmSound }}\" aria-label=\"Alarm sound\" style=\"min-height: 34px; padding: 0 6px; border-radius: 8px; border: 1.5px solid rgba(244,250,244,0.3); background: rgba(0,0,0,0.2); color: #F4FAF4; font-size: 12px; font-weight: 700; cursor: pointer;\">\n            <option value=\"bell\">🔔 School bell<\u002Foption>\n            <optio utton type=\"button\" sc-camel-on-click=\"{{ k.onToggle }}\" style=\"padding: 5px 11px; border-radius: 999px; border: 1.5px solid {{ k.border }}; background: {{ k.bg }}; color: {{ k.fg }}; font-size: 12px; font-weight: 700; cursor: pointer;\">{{ k.name }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <!-- ==================== AWARD XP ==================== -->\n    <sc-if value=\"{{ loaded }}\" hint-placeholder-val=\"{{ false }}\">\n      <section id=\"sec-game\" style=\"scroll-margin-top: 130px; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 22px; align-items: stretch;\">\n        <div style=\"background: #0E4A2F; border-radius: 18px; box-shadow: 0 14px 34px rgba(23,37,28,0.16); padding: 24px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden;\">\n          <svg sc-camel-view-box=\"0 0 200 200\" aria-hidden=\"true\" style=\"position: absolute; right: -34px; bottom: -46px; width: 210px; height: 210px; opacity: 0.13;\">\n            <path d=\"M100 8 C 165 28 195 88 190 158 C 130 163 85 128 80 68 Z\" fill=\"#A8D84C\"><\u002Fpath>\n          <\u002Fsvg>\n          <div style=\"position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;\">\n            <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 23px; font-weight: 700; color: #F4FAF4;\">Call on a student<\u002Fh2>\n            <span style=\"padding: 4px 12px; border-radius: 999px; background: rgba(168,216,76,0.18); color: #A8D84C; font-family: 'Bricolage Grotesque', sans-serif; font-size: 12px; font-weight: 700;\">{{ activeName }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"position: relative; flex: 1 1 auto; min-height: 176px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 18px 14px; border-radius: 14px; background: rgba(255,255,255,0.07); border: 1.5px dashed rgba(168,216,76,0.45); text-align: center;\">\n            <sc-if value=\"{{ hasCurrent }}\" hint-placeholder-val=\"{{ false }}\">\n              <div key=\"{{ currentKey }}\" style=\"animation: bfbPop 240ms ease both; display: flex; flex-direction: column; align-items: center; gap: 10px;\">\n                <div style=\"display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;\">\n                  <sc-if value=\"{{ currentIsLeader }}\" hint-placeholder-val=\"{{ false }}\">\n                    <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 34px; height: 34px; flex: none;\"><path d=\"M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-1.7 10H4.7z\" fill=\"#F7C24B\" stroke=\"#B98A12\" stroke-width=\"1.2\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ currentHasDot }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span title=\"{{ currentDotTitle }}\" style=\"width: 20px; height: 20px; flex: none; border-radius: 999px; border: 2px solid rgba(255,255,255,0.5); background: {{ currentDotColor }};\"><\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-for list=\"{{ currentMarks }}\" as=\"m\" hint-placeholder-count=\"0\">\n                    <div role=\"img\" aria-label=\"{{ m.label }}\" style=\"width: 54px; height: 54px; flex: none; border-radius: 10px; background-color: rgba(255,255,255,0.9); background-image: {{ m.css }}; background-size: contain; background-position: center; background-repeat: no-repeat;\"><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ onAwardCurrent }}\" title=\"Click to give XP\" style=\"display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 10px; border-radius: 14px; border: 1.5px solid transparent; background: transparent; cursor: pointer;\" style-hover=\"border-color: rgba(168,216,76,0.7); background: rgba(168,216,76,0.14);\">\n                  <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(32px, 4.6vw, 58px); font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; color: #FFFDF3; text-wrap: balance;\">{{ currentName }}<\u002Fspan>\n                  <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #A8D84C;\">Tap for {{ plusLabel }} XP<\u002Fspan>\n                <\u002Fbutton>\n                <div style=\"display: flex; gap: 14px; align-items: baseline;\">\n                  <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800; color: #A8D84C;\">{{ currentDaily }} XP today<\u002Fspan>\n                  <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 700; color: rgba(244,250,244,0.72);\">{{ currentCum }} total<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noCurrent }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size: 15px; font-weight: 600; color: rgba(244,250,244,0.72); max-width: 30ch;\">Press below to call on someone at random — or click any student's name anywhere on the page to give them {{ plusLabel }} XP. {{ undoHint }} undoes.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"position: relative; display: flex; gap: 10px; flex-wrap: wrap;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onPick }}\" style=\"flex: 1 1 170px; min-height: 52px; padding: 0 20px; border-radius: 999px; border: none; background: #F7C24B; color: #3E2C05; box-shadow: 0 3px 0 rgba(0,0,0,0.28); font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800; cursor: pointer;\" style-hover=\"background: #FFD46B;\" style-active=\"transform: translateY(3px); box-shadow: none;\">{{ pickLabel }}<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ onSkip }}\" style=\"flex: 0 1 108px; min-height: 52px; padding: 0 16px; border-radius: 999px; border: 1.5px solid rgba(244,250,244,0.4); background: transparent; color: #F4FAF4; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,0.12);\">Skip<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border: 1.5px solid #DCD9CD; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n          <div>\n            <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 23px; font-weight: 700;\">Award Power Ranger XP<\u002Fh2>\n            <p style=\"margin: 5px 0 0; font-size: 14px; color: #5C6B60;\">Goes to <strong>{{ awardTargetLabel }}<\u002Fstrong>. Adds to today and to the running total.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n            <sc-for list=\"{{ pointButtons }}\" as=\"p\" hint-placeholder-count=\"2\">\n              <button type=\"button\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"min-height: 62px; border-radius: 14px; border: 1.5px solid #2E8B5E; background: #DCEBDF; color: #0E4A2F; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; cursor: pointer;\" style-hover=\"background: #A8D84C;\" style-active=\"transform: translateY(2px);\">{{ p.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5C6B60; margin-bottom: 6px;\">Custom amount<\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">\n              <input value=\"{{ customXp }}\" sc-camel-on-change=\"{{ onCustomXp }}\" type=\"number\" aria-label=\"Custom XP amount\" style=\"flex: 1 1 90px; min-width: 80px; min-height: 46px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #BFC4B4; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800; text-align: center;\">\n              <button type=\"button\" sc-camel-on-click=\"{{ onAwardCustom }}\" style=\"flex: 1 1 100px; min-height: 46px; padding: 0 18px; border-radius: 10px; border: none; background: #17603F; color: #F4FAF4; box-shadow: 0 2px 0 rgba(14,74,47,0.35); font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #2E8B5E;\" style-active=\"transform: translateY(2px); box-shadow: none;\">Award<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ onUndo }}\" disabled=\"{{ noUndo }}\" title=\"{{ undoTitle }}\" aria-label=\"Undo last XP change\" style=\"flex: none; width: 46px; height: 46px; border-radius: 999px; border: 1.5px solid #BFC4B4; background: #FFFFFF; color: #17603F; cursor: pointer; display: grid; place-items: center; padding: 0; opacity: {{ undoOpacity }};\" style-hover=\"background: #DCEBDF; border-color: #2E8B5E;\">\n                <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 22px; height: 22px;\"><path d=\"M4.5 10h9a5 5 0 1 1 0 10H9\" stroke=\"currentColor\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M8.5 5 3.6 10l4.9 5\" stroke=\"currentColor\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top: 6px; font-size: 12px; font-weight: 600; color: #8A9689;\">{{ undoTitle }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5C6B60; margin-bottom: 6px;\">Or award the whole group<\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">\n              <sc-raw-select value=\"{{ awardGroup }}\" sc-camel-on-change=\"{{ onAwardGroup }}\" aria-label=\"Group to award\" style=\"flex: 1 1 140px; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #BFC4B4; background: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer;\">\n                <option value=\"\">Pick a group…<\u002Foption>\n                <sc-for list=\"{{ groupOptions }}\" as=\"g\" hint-placeholder-count=\"0\">\n                  <option value=\"{{ g.value }}\">{{ g.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <button type=\"button\" sc-camel-on-click=\"{{ onAwardGroupXp }}\" style=\"flex: 0 1 150px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1.5px solid #2E8B5E; background: #DCEBDF; color: #17603F; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #cfe4d4;\">Give each {{ customXpLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n            <div key=\"{{ toastKey }}\" style=\"margin-top: auto; padding: 11px 14px; border-radius: 999px; background: #A8D84C; color: #17251C; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; text-align: center; animation: bfbToast 1900ms ease both;\">{{ toast }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ==================== LEADERBOARD ==================== -->\n    <sc-if value=\"{{ loaded }}\" hint-placeholder-val=\"{{ false }}\">\n      <section id=\"sec-board\" style=\"scroll-margin-top: 130px; background: #FFFFFF; border: 1.5px solid #DCD9CD; border-radius: 18px; padding: 24px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onToggleBoard }}\" style=\"width: 100%; display: flex; align-items: center; gap: 12px; padding: 0; border: none; background: transparent; cursor: pointer; text-align: left;\">\n          <span aria-hidden=\"true\" style=\"width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 9px; background: #F2F5EF; color: #17603F; font-size: 13px; font-weight: 800;\">{{ boardChevron }}<\u002Fspan>\n          <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.015em; color: #17251C;\">Leaderboard<\u002Fspan>\n          <span style=\"margin-left: auto; font-size: 13px; font-weight: 700; color: #5C6B60;\">{{ boardToggleNote }}<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ boardOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 16px 0;\">\n          <div style=\"flex: 1 1 240px;\">\n            <p style=\"margin: 0; font-size: 14px; color: #5C6B60;\">Ties get full XP each and sort alphabetically by first name. Click a name to give {{ plusLabel }} XP.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: #F2F5EF; border: 1.5px solid #E4E1D6;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onThisClass }}\" style=\"min-height: 36px; padding: 0 16px; border-radius: 999px; border: none; cursor: pointer; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; background: {{ tabSoloBg }}; color: {{ tabSoloFg }};\">This class<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ onCompare }}\" style=\"min-height: 36px; padding: 0 16px; border-radius: 999px; border: none; cursor: pointer; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; background: {{ tabCompareBg }}; color: {{ tabCompareFg }};\">All checked classes<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: #F2F5EF; border: 1.5px solid #E4E1D6;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onSortDaily }}\" style=\"min-height: 36px; padding: 0 16px; border-radius: 999px; border: none; cursor: pointer; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; background: {{ sortDailyBg }}; color: {{ sortDailyFg }};\">Rank by today<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ onSortCum }}\" style=\"min-height: 36px; padding: 0 16px; border-radius: 999px; border: none; cursor: pointer; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; background: {{ sortCumBg }}; color: {{ sortCumFg }};\">Rank by total<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 44px 1fr 110px 110px; gap: 10px; padding: 0 14px 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #8A9689;\">\n          <span>Rank<\u002Fspan><span>Student<\u002Fspan><span style=\"text-align: right;\">XP today<\u002Fspan><span style=\"text-align: right;\">Total XP<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n          <sc-for list=\"{{ board }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"position: relative; overflow: hidden; display: grid; grid-template-columns: 44px 1fr 110px 110px; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px; border: 1.5px solid {{ r.border }}; background: {{ r.bg }};\">\n              <span style=\"position: absolute; left: 0; top: 0; bottom: 0; opacity: 0.1; background: {{ r.color }}; width: {{ r.bar }}\"><\u002Fspan>\n              <span style=\"position: relative; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 999px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; background: {{ r.rankBg }}; color: {{ r.rankFg }};\">{{ r.rank }}<\u002Fspan>\n              <span style=\"position: relative; display: flex; align-items: center; gap: 9px; min-width: 0;\">\n                <sc-if value=\"{{ r.isLeader }}\" hint-placeholder-val=\"{{ false }}\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 24px; height: 24px; flex: none;\"><path d=\"M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-1.7 10H4.7z\" fill=\"#F7C24B\" stroke=\"#B98A12\" stroke-width=\"1.2\"><\u002Fpath><\u002Fsvg>\n                <\u002Fsc-if>\n                <sc-for list=\"{{ r.marks }}\" as=\"m\" hint-placeholder-count=\"0\">\n                  <div role=\"img\" aria-label=\"{{ m.label }}\" title=\"{{ m.label }}\" style=\"width: 40px; height: 40px; flex: none; border-radius: 8px; background-color: #FFFFFF; background-image: {{ m.css }}; background-size: contain; background-position: center; background-repeat: no-repeat; border: 1.5px solid #E4E1D6;\"><\u002Fdiv>\n                <\u002Fsc-for>\n                <button type=\"button\" sc-camel-on-click=\"{{ r.onAward }}\" title=\"Click to give XP\" style=\"flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border-radius: 9px; border: 1.5px solid transparent; background: transparent; cursor: pointer; text-align: left;\" style-hover=\"border-color: #2E8B5E; background: #DCEBDF;\">\n                  <sc-if value=\"{{ r.hasDot }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span title=\"{{ r.dotTitle }}\" style=\"width: 13px; height: 13px; flex: none; border-radius: 999px; border: 1.5px solid rgba(0,0,0,0.16); background: {{ r.dotColor }};\"><\u002Fspan>\n                  <\u002Fsc-if>\n                  <span style=\"flex: 1 1 auto; min-width: 0; font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ r.name }}<\u002Fspan>\n                  <span style=\"flex: none; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 800; color: #17603F;\">{{ r.plusLabel }}<\u002Fspan>\n                <\u002Fbutton>\n                <sc-if value=\"{{ r.showCls }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"flex: none; padding: 2px 10px; border-radius: 999px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 11px; font-weight: 700; color: #FFFFFF; background: {{ r.color }}\">{{ r.cls }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fspan>\n              <span style=\"position: relative; text-align: right; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; color: #17603F;\">{{ r.daily }}<\u002Fspan>\n              <span style=\"position: relative; text-align: right; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; color: #5C6B60;\">{{ r.cum }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ boardCapped }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onShowAllBoard }}\" style=\"margin-top: 10px; width: 100%; min-height: 44px; border-radius: 12px; border: 1.5px dashed #C6D0C2; background: #F2F5EF; cursor: pointer; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; color: #17603F;\" style-hover=\"background: #DCEBDF; border-color: #2E8B5E;\">{{ boardCapNote }} — show all<\u002Fbutton>\n        <\u002Fsc-if>\n        <div style=\"margin-top: 12px; font-size: 12px; font-weight: 600; color: #8A9689;\">{{ boardFooter }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ==================== GROUPS ==================== -->\n    <sc-if value=\"{{ loaded }}\" hint-placeholder-val=\"{{ false }}\">\n      <section id=\"sec-groups\" style=\"scroll-margin-top: 130px; background: #EEF3E7; border: 1.5px solid #CFDCC4; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px;\">\n        <div style=\"display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap;\">\n          <div style=\"flex: 1 1 260px;\">\n            <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.015em;\">Form groups<\u002Fh2>\n            <p style=\"margin: 4px 0 0; font-size: 14px; color: #5C6B60; max-width: 78ch;\">Named leaders are spread one per group first, then everyone else is dealt out by XP for balance. Locked students stay put when you shuffle, and flagged pairs are kept apart.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap;\">\n            <div>\n              <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5C6B60; margin-bottom: 6px;\">Split by<\u002Fdiv>\n              <div style=\"display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #DCD9CD;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onModeSize }}\" style=\"min-height: 34px; padding: 0 14px; border-radius: 999px; border: none; cursor: pointer; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; background: {{ modeSizeBg }}; color: {{ modeSizeFg }};\">Group size<\u002Fbutton>\n                <b
