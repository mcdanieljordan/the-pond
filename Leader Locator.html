 solid {{ g.headBorder }}; background: {{ g.lockBg }}; color: {{ g.lockFg }}; font-family: 'Bricolage Grotesque', sans-serif; font-size: 11px; font-weight: 800; cursor: pointer;\">{{ g.lockLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"flex: 1; display: flex; flex-direction: column; gap: 7px; padding: 13px 14px;\">\n                  <sc-for list=\"{{ g.members }}\" as=\"m\" hint-placeholder-count=\"4\">\n                    <div style=\"display: flex; align-items: center; gap: 8px;\">\n                      <sc-if value=\"{{ m.isLeader }}\" hint-placeholder-val=\"{{ false }}\">\n                        <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 18px; height: 18px; flex: none;\"><path d=\"M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-1.7 10H4.7z\" fill=\"#F7C24B\" stroke=\"#B98A12\" stroke-width=\"1.2\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fsc-if>\n                      <sc-for list=\"{{ m.marks }}\" as=\"mk\" hint-placeholder-count=\"0\">\n                        <div role=\"img\" aria-label=\"{{ mk.label }}\" style=\"width: 26px; height: 26px; flex: none; border-radius: 6px; background-color: #F2F5EF; background-image: {{ mk.css }}; background-size: contain; background-position: center; background-repeat: no-repeat;\"><\u002Fdiv>\n                      <\u002Fsc-for>\n                      <button type=\"button\" sc-camel-on-click=\"{{ m.onAward }}\" title=\"Click to give XP\" style=\"flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 8px; border-radius: 8px; border: 1.5px solid {{ m.hlBorder }}; background: {{ m.hlBg }}; cursor: pointer; text-align: left;\" style-hover=\"border-color: #2E8B5E; background: #DCEBDF;\">\n                        <sc-if value=\"{{ m.hasDot }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span title=\"{{ m.dotTitle }}\" style=\"width: 12px; height: 12px; flex: none; border-radius: 999px; border: 1.5px solid rgba(0,0,0,0.16); background: {{ m.dotColor }};\"><\u002Fspan>\n                        <\u002Fsc-if>\n                        <span style=\"flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: {{ m.weight }}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #17251C;\">{{ m.name }}<\u002Fspan>\n                      <\u002Fbutton>\n                      <span style=\"flex: none; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 800; color: #17603F;\">{{ m.xp }}<\u002Fspan>\n                      <button type=\"button\" sc-camel-on-click=\"{{ m.onLock }}\" title=\"Keep this student in this group\" aria-label=\"Lock student\" style=\"flex: none; width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid {{ m.lockBorder }}; background: {{ m.lockBg }}; cursor: pointer; padding: 0; display: grid; place-items: center;\">\n                        <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 13px; height: 13px;\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\" fill=\"{{ m.lockIcon }}\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\" stroke=\"{{ m.lockIcon }}\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 8px; padding: 0 14px 14px;\">\n                  <span style=\"flex: 1; font-size: 12px; font-weight: 700; color: #8A9689;\">{{ g.meta }}<\u002Fspan>\n                  <button type=\"button\" sc-camel-on-click=\"{{ g.onCopy }}\" style=\"min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #BFC4B4; background: #F7F4EC; color: #17603F; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #DCEBDF; border-color: #2E8B5E;\">{{ g.copyLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onCopyAllGroups }}\" style=\"min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #2E8B5E; background: #FFFFFF; color: #17603F; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #DCEBDF;\">{{ copyAllLabel }}<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ onRenameTeams }}\" style=\"min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #F2762E; background: #FDE7D6; color: #7A3410; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #f8d5bb;\">New team names<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ onClearLocks }}\" style=\"min-height: 40px; padding: 0 18px; border-radius: 999px; border: none; background: transparent; color: #5C6B60; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: underline;\">Clear all locks<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noGroups }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding: 26px; border-radius: 14px; border: 1.5px dashed #BFC4B4; text-align: center; font-size: 15px; font-weight: 600; color: #5C6B60;\">No groups yet — set a number and press <span style=\"color: #17603F;\">Make groups<\u002Fspan>.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ==================== HANDOUT ==================== -->\n    <section id=\"sec-handout\" style=\"scroll-margin-top: 130px; display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 22px; align-items: start;\">\n      <div style=\"background: #FFFFFF; border: 1.5px solid #DCD9CD; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n        <div>\n          <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.015em;\">Instructions handout<\u002Fh2>\n          <p style=\"margin: 4px 0 0; font-size: 14px; color: #5C6B60;\">Checkbox task list students can tick off. Saves with the session; print several to a page and cut.<\u002Fp>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5C6B60; margin-bottom: 6px;\">Title<\u002Fdiv>\n          <input value=\"{{ hoTitle }}\" sc-camel-on-change=\"{{ onHoTitle }}\" style=\"width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #BFC4B4; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 700;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5C6B60; margin-bottom: 6px;\">Intro (optional)<\u002Fdiv>\n          <textarea value=\"{{ hoIntro }}\" sc-camel-on-change=\"{{ onHoIntro }}\" style=\"width: 100%; min-height: 66px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #BFC4B4; background: #FFFFFF; font-size: 14px; line-height: 1.5; resize: vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5C6B60;\">Tasks<\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ onAddTask }}\" style=\"min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #2E8B5E; background: #DCEBDF; color: #17603F; font-family: 'Bricolage Grotesque', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #cfe4d4;\">+ Add task<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n            <sc-for list=\"{{ tasks }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; align-items: center; gap: 6px;\">\n                <span style=\"width: 20px; height: 20px; flex: none; border: 2px solid #17603F; border-radius: 4px;\"><\u002Fspan>\n                <input value=\"{{ t.text }}\" sc-camel-on-change=\"{{ t.onText }}\" aria-label=\"Task\" style=\"flex: 1 1 auto; min-width: 0; min-height: 38px; padding: 0 10px; border-radius: 8px; border: 1.5px solid #DCD9CD; background: #FFFFFF; font-size: 14px; font-weight: {{ t.weight }}; font-style: {{ t.style }}; text-decoration: {{ t.deco }};\" style-focus=\"border-color: #17603F;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ t.onBold }}\" aria-label=\"Bold\" style=\"width: 32px; height: 38px; flex: none; border-radius: 8px; border: 1.5px solid {{ t.bBorder }}; background: {{ t.bBg }}; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 800; cursor: pointer;\">B<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ t.onItalic }}\" aria-label=\"Italic\" style=\"width: 32px; height: 38px; flex: none; border-radius: 8px; border: 1.5px solid {{ t.iBorder }}; background: {{ t.iBg }}; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; font-style: italic; cursor: pointer;\">I<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ t.onUnderline }}\" aria-label=\"Underline\" style=\"width: 32px; height: 38px; flex: none; border-radius: 8px; border: 1.5px solid {{ t.uBorder }}; background: {{ t.uBg }}; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; text-decoration: underline; cursor: pointer;\">U<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ t.onRemove }}\" aria-label=\"Remove task\" style=\"width: 30px; height: 38px; flex: none; border-radius: 8px; border: none; background: transparent; color: #8A9689; font-size: 14px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #FADFDB; color: #C9402F;\">✕<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;\">\n          <div>\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5C6B60; margin-bottom: 6px;\">Print font<\u002Fdiv>\n            <sc-raw-select value=\"{{ hoFont }}\" sc-camel-on-change=\"{{ onHoFont }}\" style=\"min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1.5px solid #BFC4B4; background: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer;\">\n              <option value=\"'Century Gothic', 'Questrial', 'Nunito Sans', sans-serif\">Century Gothic<\u002Foption>\n              <option value=\"'Comic Sans MS', 'Comic Neue', cursive\">Comic Sans<\u002Foption>\n              <option value=\"'Nunito Sans', sans-serif\">Nunito Sans<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5C6B60; margin-bottom: 6px;\">Size<\u002Fdiv>\n            <div style=\"display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: #F2F5EF; border: 1.5px solid #E4E1D6;\">\n              <sc-for list=\"{{ sizeOptions }}\" as=\"z\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ z.onClick }}\" style=\"min-height: 34px; padding: 0 14px; border-radius: 999px; border: none; cursor: pointer; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; background: {{ z.bg }}; color: {{ z.fg }};\">{{ z.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5C6B60; margin-bottom: 6px;\">Copies per page<\u002Fdiv>\n            <div style=\"display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: #F2F5EF; border: 1.5px solid #E4E1D6;\">\n              <sc-for list=\"{{ copyOptions }}\" as=\"k\" hint-placeholder-count=\"5\">\n                <button type=\"button\" sc-camel-on-click=\"{{ k.onClick }}\" style=\"min-width: 38px; min-height: 34px; border-radius: 999px; border: none; cursor: pointer; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 800; background: {{ k.bg }}; color: {{ k.fg }};\">{{ k.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <label style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #5C6B60; cursor: pointer;\">\n            <input type=\"checkbox\" checked=\"{{ hoIncludeGroups }}\" sc-camel-on-change=\"{{ onHoIncludeGroups }}\" style=\"width: 18px; height: 18px; accent-color: #17603F; cursor: pointer;\">\n            Print group rosters too\n          <\u002Flabel>\n          <button type=\"button\" sc-camel-on-click=\"{{ onPrint }}\" style=\"min-height: 44px; padding: 0 24px; border-radius: 999px; border: none; background: #F2762E; color: #FFFFFF; box-shadow: 0 2px 0 rgba(201,90,28,0.4); font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #FF8A45;\" style-active=\"transform: translateY(2px); box-shadow: none;\">Print handout<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- preview -->\n      <div style=\"background: #E9E5DA; border: 1.5px solid #DCD9CD; border-radius: 18px; padding: 20px;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px;\">\n          <h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700;\">Print preview<\u002Fh3>\n          <span style=\"font-size: 12px; font-weight: 700; color: #5C6B60;\">{{ previewNote }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; box-shadow: 0 6px 18px rgba(23,37,28,0.16); aspect-ratio: 8.5 / 11; padding: 4%; display: grid; grid-template-columns: {{ previewCols }}; grid-template-rows: {{ previewRows }}; gap: 3%;\">\n          <sc-for list=\"{{ previewCopies }}\" as=\"c\" hint-placeholder-count=\"1\">\n            <div style=\"border: 1.5px dashed #BFC4B4; border-radius: 6px; padding: 3%; overflow: hidden; display: flex; flex-direction: column; gap: 2%; font-family: {{ hoFont }};\">\n              <div style=\"font-size: {{ c.titleSize }}; font-weight: 800; line-height: 1.15; color: #17251C;\">{{ hoTitle }}<\u002Fdiv>\n              <sc-if value=\"{{ hasIntro }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size: {{ c.introSize }}; line-height: 1.35; color: #3C463E;\">{{ hoIntro }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display: flex; flex-direction: column; gap: 3px; margin-top: 2px;\">\n                <sc-for list=\"{{ tasks }}\" as=\"t\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; align-items: flex-start; gap: 5px;\">\n                    <span style=\"width: {{ c.boxSize }}; height: {{ c.boxSize }}; flex: none; border: 1.5px solid #17251C; border-radius: 2px; margin-top: 1px;\"><\u002Fspan>\n                    <span style=\"font-size: {{ c.bodySize }}; line-height: 1.3; font-weight: {{ t.weight }}; font-style: {{ t.style }}; text-decoration: {{ t.deco }}; color: #17251C;\">{{ t.text }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hoIncludeGroups }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top: auto; padding-top: 3px; border-top: 1px solid #DCD9CD; display: flex; flex-wrap: wrap; gap: 4px 10px;\">\n                  <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"0\">\n                    <span style=\"font-size: {{ c.tinySize }}; color: #3C463E;\"><strong>{{ g.name }}:<\u002Fstrong> {{ g.flat }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ==================== DAILY REPORT ==================== -->\n    <sc-if value=\"{{ loaded }}\" hint-placeholder-val=\"{{ false }}\">\n      <section id=\"sec-report\" style=\"scroll-margin-top: 130px; background: #FFFFFF; border: 1.5px solid #DCD9CD; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n        <sc-if value=\"{{ reportLocked }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width: 360px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; text-align: center; padding: 12px 0;\">\n            <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800;\">Daily report · locked<\u002Fh2>\n            <p style=\"margin: 0; font-size: 13px; color: #5C6B60;\">Enter the PIN to view history and end-of-day feedback.<\u002Fp>\n            <input value=\"{{ reportPinInput }}\" sc-camel-on-change=\"{{ onReportPinInput }}\" type=\"password\" inputmode=\"numeric\" placeholder=\"PIN\" style=\"min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #BFC4B4; text-align: center; font-size: 18px; font-weight: 800; letter-spacing: 0.2em;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onReportUnlock }}\" style=\"min-height: 44px; padding: 0 20px; border-radius: 999px; border: none; background: #17603F; color: #F4FAF4; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #2E8B5E;\">Unlock<\u002Fbutton>\n            <sc-if value=\"{{ reportPinError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 12px; font-weight: 700; color: #C9402F;\">Wrong PIN — try again.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ reportUnlocked }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;\">\n            <div>\n              <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.015em;\">Daily report<\u002Fh2>\n              <p style=\"margin: 4px 0 0; font-size: 14px; color: #5C6B60;\">{{ activeName }} · who gained or lost, with a quick word for each.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap;\">\n              <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5C6B60;\">PIN<\u002Fspan>\n              <input value=\"{{ reportPinSetting }}\" sc-camel-on-change=\"{{ onReportPinSetting }}\" maxlength=\"8\" style=\"width: 74px; min-height: 34px; padding: 0 8px; border-radius: 8px; border: 1.5px solid #DCD9CD; text-align: center; font-size: 13px; font-weight: 700;\">\n              <button type=\"button\" sc-camel-on-click=\"{{ onReportUpdate }}\" style=\"min-height: 40px; padding: 0 18px; border-radius: 999px; border: none; background: #2C6BAF; color: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #3d7fc4;\">Update today's report<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ onReportLock }}\" style=\"min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #DCD9CD; background: transparent; color: #5C6B60; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;\">Lock<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding: 12px 16px; border-radius: 12px; background: #EEF3E7; border: 1.5px solid #CFDCC4; font-size: 13px; font-weight: 700; color: #17603F;\">{{ weeklyTotalLabel }}<\u002Fdiv>\n\n          <sc-if value=\"{{ hasHistory }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 14px; max-height: 640px; overflow: auto;\">\n              <sc-for list=\"{{ historyDays }}\" as=\"d\" hint-placeholder-count=\"2\">\n                <div style=\"border: 1.5px solid #DCD9CD; border-radius: 14px; padding: 16px;\">\n                  <div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;\">\n                    <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800;\">{{ d.date }}<\u002Fspan>\n                    <span style=\"font-size: 12px; font-weight: 700; color: #8A9689;\">{{ d.meta }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n                    <sc-for list=\"{{ d.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                      <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: {{ r.rowBg }}; flex-wrap: wrap;\">\n                        <span style=\"flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ r.name }}<\u002Fspan>\n                        <span style=\"flex: none; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 800; color: {{ r.deltaColor }};\">{{ r.deltaLabel }}<\u002Fspan>\n                        <span style=\"flex: none; width: 190px; text-align: right; font-size: 13px; font-weight: 700; color: {{ r.deltaColor }};\">{{ r.feedback }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noHistory }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding: 26px; border-radius: 14px; border: 1.5px dashed #BFC4B4; text-align: center; font-size: 14px; font-weight: 600; color: #5C6B60;\">No report yet — press <span style=\"color: #2C6BAF;\">Update today's report<\u002Fspan> to log today.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section id=\"sec-import\" style=\"scroll-margin-top: 130px;\">\n      <sc-if value=\"{{ showPaste }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 22px; align-items: start;\">\n          <div style=\"background: #FFFFFF; border: 1.5px solid #DCD9CD; border-radius: 16px; box-shadow: 0 4px 12px rgba(23,37,28,0.10); padding: 22px;\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;\">\n              <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 23px; font-weight: 700; letter-spacing: -0.01em;\">Import / manage students<\u002Fh2>\n              <button type=\"button\" sc-camel-on-click=\"{{ onSample }}\" style=\"min-height: 32px; padding: 0 10px; border-radius: 999px; border: none; background: transparent; color: #5C6B60; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: underline;\">Insert format example<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin: 6px 0 14px; font-size: 14px; color: #5C6B60;\">Standard JSON. Multiple classes in one paste. New classes/students are encrypted and pushed to Supabase; existing names keep their XP.<\u002Fp>\n            <textarea value=\"{{ raw }}\" sc-camel-on-change=\"{{ onRaw }}\" spellcheck=\"false\" placeholder=\"{ &quot;classes&quot;: [ { &quot;className&quot;: &quot;Period 3&quot;, &quot;students&quot;: [&quot;John Smith&quot;] } ] }\" style=\"width: 100%; min-height: 170px; padding: 13px; border-radius: 10px; border: 1.5px solid #BFC4B4; background: #F2F5EF; color: #17251C; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.55; resize: vertical;\"><\u002Ftextarea>\n            <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; gap: 10px; margin-top: 12px; padding: 11px 13px; border-radius: 10px; background: #FADFDB; border: 1.5px solid #C9402F;\">\n                <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 20px; height: 20px; flex: none;\"><circle cx=\"12\" cy=\"12\" r=\"11\" fill=\"#C9402F\"><\u002Fcircle><path d=\"M12 6.5 v7.5 M12 17.4 v0.2\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size: 14px; font-weight: 600; color: #8E2B1E;\">{{ error }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px;\">\n              <button type=\"button\" sc-camel-on-click=\"{{ onLoadRoster }}\" style=\"min-height: 44px; padding: 0 24px; border-radius: 999px; border: none; background: #17603F; color: #F4FAF4; box-shadow: 0 2px 0 rgba(14,74,47,0.35); font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #2E8B5E;\" style-active=\"transform: translateY(2px); box-shadow: none;\">Load &amp; sync students<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ onClearRaw }}\" style=\"min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #BFC4B4; background: #FFFFFF; color: #5C6B60; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #F2F5EF;\">Clear box<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background: #FDE7D6; border: 1.5px solid #F2762E; border-radius: 16px; padding: 22px;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 22px; height: 22px; flex: none;\"><path d=\"M12 2 l2.2 6.2 L20.5 10.5 l-6.3 2.3 L12 19 l-2.2-6.2 L3.5 10.5 l6.3-2.3 Z\" fill=\"#F2762E\"><\u002Fpath><\u002Fsvg>\n              <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 23px; font-weight: 700; letter-spacing: -0.01em; color: #7A3410;\">Convert with AI<\u002Fh2>\n            <\u002Fdiv>\n            <p style=\"margin: 6px 0 12px; font-size: 14px; color: #7A3410;\">Any roster format — spreadsheet, class list, messy text. Copy this prompt into any AI assistant and paste your roster where it says.<\u002Fp>\n            <pre style=\"margin: 0; padding: 14px; border-radius: 10px; background: #FFFDF7; border: 1.5px solid #E9C9AE; color: #17251C; font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto;\">{{ aiPrompt }}<\u002Fpre>\n            <button type=\"button\" sc-camel-on-click=\"{{ onCopyPrompt }}\" style=\"margin-top: 14px; min-height: 44px; padding: 0 22px; border-radius: 999px; border: none; background: #F2762E; color: #FFFFFF; box-shadow: 0 2px 0 rgba(201,90,28,0.4); font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #FF8A45;\" style-active=\"transform: translateY(2px); box-shadow: none;\">{{ promptCopyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <p style=\"margin: 0; font-size: 12px; font-weight: 600; color: #8A9689; text-align: center; order: 100;\">{{ footerNote }}<\u002Fp>\n  <\u002Fmain>\n\n  <!-- ==================== FLOATING NOTES ==================== -->\n  <div data-note-layer=\"1\" style=\"position: fixed; inset: 0; z-index: 60; pointer-events: none;\">\n    <sc-for list=\"{{ notes }}\" as=\"n\" hint-placeholder-count=\"0\">\n      <div style=\"position: absolute; pointer-events: auto; left: {{ n.left }}; top: {{ n.top }}; width: {{ n.width }}; border-radius: 12px; background: {{ n.bg }}; border: 1.5px solid {{ n.border }}; box-shadow: 0 14px 34px rgba(23,37,28,0.22); display: flex; flex-direction: column; overflow: hidden;\">\n        <div sc-camel-on-mouse-down=\"{{ n.onDragStart }}\" style=\"display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 10px; background: {{ n.headBg }}; cursor: grab; user-select: none; flex: none;\">\n          <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 14px; height: 14px; flex: none; opacity: 0.55;\"><circle cx=\"9\" cy=\"6\" r=\"1.6\" fill=\"#17251C\"><\u002Fcircle><circle cx=\"15\" cy=\"6\" r=\"1.6\" fill=\"#17251C\"><\u002Fcircle><circle cx=\"9\" cy=\"12\" r=\"1.6\" fill=\"#17251C\"><\u002Fcircle><circle cx=\"15\" cy=\"12\" r=\"1.6\" fill=\"#17251C\"><\u002Fcircle><circle cx=\"9\" cy=\"18\" r=\"1.6\" fill=\"#17251C\"><\u002Fcircle><circle cx=\"15\" cy=\"18\" r=\"1.6\" fill=\"#17251C\"><\u002Fcircle><\u002Fsvg>\n          <input value=\"{{ n.title }}\" sc-camel-on-change=\"{{ n.onTitle }}\" aria-label=\"Note title\" style=\"flex: 1 1 auto; min-width: 0; min-height: 28px; padding: 0 8px; border-radius: 6px; border: 1.5px solid transparent; background: rgba(255,255,255,0.5); font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 800; color: #17251C;\" style-focus=\"background: #FFFFFF; border-color: #17603F;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ n.onCycleColor }}\" aria-label=\"Change note colour\" style=\"width: 24px; height: 24px; flex: none; border-radius: 6px; border: 1.5px solid rgba(0,0,0,0.18); background: {{ n.swatch }}; cursor: pointer; padding: 0;\"><\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ n.onMin }}\" aria-label=\"Minimise note\" style=\"width: 26px; height: 26px; flex: none; border-radius: 6px; border: none; background: transparent; color: #17251C; font-size: 15px; font-weight: 800; line-height: 1; cursor: pointer;\" style-hover=\"background: rgba(0,0,0,0.1);\">{{ n.minIcon }}<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ n.onClose }}\" aria-label=\"Delete note\" style=\"width: 26px; height: 26px; flex: none; border-radius: 6px; border: none; background: transparent; color: #17251C; font-size: 13px; font-weight: 800; line-height: 1; cursor: pointer;\" style-hover=\"background: #FADFDB; color: #C9402F;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ n.open }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position: relative; display: flex; flex-direction: column;\">\n            <textarea value=\"{{ n.body }}\" sc-camel-on-change=\"{{ n.onBody }}\" placeholder=\"Directions, reminders, anything…\" style=\"width: 100%; height: {{ n.bodyHeight }}; padding: 10px 12px; border: none; background: transparent; color: #17251C; font-size: 14px; line-height: 1.5; resize: none;\"><\u002Ftextarea>\n            <div sc-camel-on-mouse-down=\"{{ n.onResizeStart }}\" title=\"Drag to resize\" style=\"position: absolute; right: 0; bottom: 0; width: 20px; height: 20px; cursor: nwse-resize;\">\n              <svg sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\" style=\"width: 20px; height: 20px; opacity: 0.4;\"><path d=\"M18 6 L6 18 M18 12 L12 18\" stroke=\"#17251C\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- ==================== BIG TIMER ==================== -->\n  <sc-if value=\"{{ bigTimer }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 9000; background: #0E4A2F; color: #F4FAF4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; animation: bfbFade 160ms ease both;\">\n      <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #A8D84C;\">{{ activeName }}<\u002Fdiv>\n      <div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: min(28vw, 42vh); font-weight: 800; line-height: 0.9; letter-spacing: -0.03em; color: {{ timerColor }};\">{{ timerText }}<\u002Fdiv>\n      <div style=\"display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onTimerToggle }}\" style=\"min-height: 58px; padding: 0 34px; border-radius: 999px; border: none; background: #F7C24B; color: #3E2C05; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; cursor: pointer;\" style-hover=\"background: #FFD46B;\">{{ timerBtn }}<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ onTimerReset }}\" style=\"min-height: 58px; padding: 0 28px; border-radius: 999px; border: 1.5px solid rgba(244,250,244,0.4); background: transparent; color: #F4FAF4; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,0.14);\">Reset<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ onToggleBigTimer }}\" style=\"min-height: 58px; padding: 0 28px; border-radius: 999px; border: 1.5px solid rgba(244,250,244,0.4); background: transparent; color: #F4FAF4; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,0.14);\">Shrink<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"width: min(640px, 88vw); background: rgba(255,255,255,0.08); border: 1.5px solid rgba(168,216,76,0.4); border-radius: 14px; padding: 14px 18px; text-align: center;\">\n        <div style=\"font-size: 15px; font-weight: 700; margin-bottom: 8px;\">What do we do when the timer ends?<\u002Fdiv>\n        <input value=\"{{ timerEndNote }}\" sc-camel-on-change=\"{{ onTimerEndNote }}\" placeholder=\"Type the answer here\" style=\"width: 100%; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1.5px solid rgba(244,250,244,0.4); background: rgba(0,0,0,0.2); color: #F4FAF4; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 700; text-align: center;\">\n      <\u002Fdiv>\n      <div style=\"font-size: 13px; font-weight: 600; color: rgba(244,250,244,0.6);\">Esc closes<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ==================== ALARM GRAPHIC ==================== -->\n  <sc-if value=\"{{ alarmVisible }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onDismissAlarm }}\" style=\"position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 9100; background: rgba(14,74,47,0.96); color: #F4FAF4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; cursor: pointer; animation: bfbFade 160ms ease both;\">\n      <sc-if value=\"{{ alarmIsBell }}\" hint-placeholder-val=\"{{ false }}\">\n        <svg sc-camel-view-box=\"0 0 200 200\" aria-hidden=\"true\" style=\"width: min(46vw, 40vh); height: min(46vw, 40vh); transform-origin: 100px 18px; animation: bfbSwing 620ms ease-in-out infinite;\">\n          <path d=\"M100 6 a10 10 0 0 1 10 10 v10 h-20 V16 a10 10 0 0 1 10-10z\" fill=\"#A8D84C\"><\u002Fpath>\n          <path d=\"M100 26 c40 0 56 42 58 84 l4 26 H38 l4-26 c2-42 18-84 58-84z\" fill=\"#F7C24B\" stroke=\"#B98A12\" stroke-width=\"4\"><\u002Fpath>\n          <rect x=\"30\" y=\"136\" width=\"140\" height=\"16\" rx=\"8\" fill=\"#E8A62B\"><\u002Frect>\n          <circle cx=\"100\" cy=\"170\" r=\"14\" fill=\"#F7C24B\" stroke=\"#B98A12\" stroke-width=\"4\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ alarmIsChime }}\" hint-placeholder-val=\"{{ false }}\">\n        <svg sc-camel-view-box=\"0 0 200 200\" aria-hidden=\"true\" style=\"width: min(46vw, 40vh); height: min(46vw, 40vh);\">\n          <rect x=\"24\" y=\"18\" width=\"152\" height=\"12\" rx=\"6\" fill=\"#A8D84C\"><\u002Frect>\n          <rect x=\"44\" y=\"30\" width=\"20\" height=\"100\" rx=\"10\" fill=\"#F7C24B\" style=\"transform-origin: 54px 30px; animation: bfbGlow 900ms ease-in-out infinite;\"><\u002Frect>\n          <rect x=\"80\" y=\"30\" width=\"20\" height=\"124\" rx=\"10\" fill=\"#FFFDF3\" style=\"transform-origin: 90px 30px; animation: bfbGlow 900ms ease-in-out 150ms infinite;\"><\u002Frect>\n          <rect x=\"116\" y=\"30\" width=\"20\" height=\"146\" rx=\"10\" fill=\"#A8D84C\" style=\"transform-origin: 126px 30px; animation: bfbGlow 900ms ease-in-out 300ms infinite;\"><\u002Frect>\n          <circle cx=\"164\" cy=\"120\" r=\"12\" fill=\"#F7C24B\" style=\"animation: bfbClap 900ms ease-in-out infinite;\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ alarmIsClock }}\" hint-placeholder-val=\"{{ false }}\">\n        <svg sc-camel-view-box=\"0 0 200 200\" aria-hidden=\"true\" style=\"width: min(46vw, 40vh); height: min(46vw, 40vh); animation: bfbShake 160ms linear infinite;\">\n          <circle cx=\"50\" u002Frect>\n        <\u002Fsvg>\n      <\u002Fsc-if>\n      <div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(38px, 7vw, 92px); font-weight: 800; letter-spacing: -0.02em; line-height: 1;\">Time's up<\u002Fdiv>\n      <div style=\"font-size: 15px; font-weight: 700; color: #A8D84C;\">{{ alarmLabel }} · click anywhere to dismiss<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ==================== CHIME FLASH (halfway / interval) ==================== -->\n  <sc-if value=\"{{ chimeFlashVisible }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 9050; background: rgba(14,74,47,0.9); color: #F4FAF4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; pointer-events: none; animation: bfbFade 160ms ease both;\">\n      <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: min(24vw, 22vh); height: min(24vw, 22vh);\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#F7C24B\" stroke=\"#B98A12\" stroke-width=\"1.5\"><\u002Fcircle><path d=\"M12 7v5l3.2 3.2\" stroke=\"#4A3405\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n      <div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(24px, 4vw, 48px); font-weight: 800;\">{{ chimeFlashLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ==================== PRINT HOST ==================== -->\n  <div id=\"bfbPrintHost\">\n    <div id=\"bfbPrint\" style=\"font-family: {{ hoFont }}; display: grid; grid-template-columns: {{ printCols }}; gap: 0.22in;\">\n      <sc-for list=\"{{ printCopies }}\" as=\"c\" hint-placeholder-count=\"1\">\n        <div style=\"border: 1px dashed #999999; border-radius: 4px; padding: 0.22in; display: flex; flex-direction: column; gap: 0.08in; break-inside: avoid;\">\n          <div style=\"font-size: {{ c.titlePt }}; font-weight: 800; line-height: 1.15; color: #000000;\">{{ hoTitle }}<\u002Fdiv>\n          <sc-if value=\"{{ hasIntro }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: {{ c.introPt }}; line-height: 1.4; color: #222222;\">{{ hoIntro }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display: flex; flex-direction: column; gap: 0.06in; margin-top: 0.04in;\">\n            <sc-for list=\"{{ tasks }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; align-items: flex-start; gap: 0.07in;\">\n                <span style=\"width: {{ c.boxPt }}; height: {{ c.boxPt }}; flex: none; border: 1.2px solid #000000; border-radius: 2px; margin-top: 0.02in;\"><\u002Fspan>\n                <span style=\"font-size: {{ c.bodyPt }}; line-height: 1.35; font-weight: {{ t.weight }}; font-style: {{ t.style }}; text-decoration: {{ t.deco }}; color: #000000;\">{{ t.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hoIncludeGroups }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top: 0.08in; padding-top: 0.06in; border-top: 1px solid #BBBBBB; display: flex; flex-direction: column; gap: 0.03in;\">\n              <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"0\">\n                <span style=\"font-size: {{ c.tinyPt }}; color: #111111;\"><strong>{{ g.name }}:<\u002Fstrong> {{ g.flat }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 1024 },\n  &quot;pointSteps&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;+5 / +10&quot;, &quot;+1 / +5&quot;, &quot;+10 / +25&quot;], &quot;default&quot;: &quot;+5 / +10&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Game&quot; },\n  &quot;defaultGroupSize&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 4, &quot;min&quot;: 2, &quot;max&quot;: 10, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Groups&quot; },\n  &quot;showMascot&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Branding&quot; }\n}\">\nconst CLS_COLORS = ['#2E8B5E','#F2762E','#2C6BAF','#D64550','#8B5FBF','#E8A62B','#0E9A8A','#B4762E'];\n/* Relative luminance so group headers put dark text on the light swatches (yellow/orange/teal). */\nfunction isLightHex(hex) {\n  const h = String(hex || '').replace('#', '');\n  if (h.length !== 6) return false;\n  const c = [0, 2, 4].map(i => {\n    const v = parseInt(h.slice(i, i + 2), 16) / 255;\n    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);\n  });\n  return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) > 0.21;\n}\nconst NOTE_COLORS = [\n  { bg: '#FFF6D6', head: '#F7E3A1', border: '#E8C96A' },\n  { bg: '#E4F3E8', head: '#BFE3CB', border: '#8FC9A4' },\n  { bg: '#FDE7D6', head: '#F8CBA8', border: '#EFA878' },\n  { bg: '#E2ECF8', head: '#C3D9F0', border: '#94B8DF' },\n  { bg: '#F1E6F8', head: '#DCC6EC', border: '#BE9FD8' }\n];\nconst KEY = 'bfb-leadership-v1';\n/* First 6 = Power Ranger role colors, auto-assigned to every student on load */\nconst DOT_COLORS = [\n  '#D64550','#2C6BAF','#F0C33B','#E85D9E','#2E8B5E','#3A3A3A',\n  '#E2622C','#E8951F','#A8B520','#12977F','#1B8FA8','#4A5AC0','#7452C8','#9E4BB8','#C43F92','#C93F63',\n  '#F09A8E','#F5B48C','#F5CE8A','#EDDE86','#CFDD93','#A7D28E','#8CCBA9','#84D0C4','#8FCADD','#9DB9E4','#AEB4EC','#C1AEEE','#D4A8E4','#E9A5CE','#EDA3B6'\n];\nconst SUPABASE_URL = 'https://qeigivfzyjitxgsrngkr.supabase.co';\nconst SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlaWdpdmZ6eWppdHhnc3JuZ2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQ0NzgsImV4cCI6MjEwMjQ2MDQ3OH0.SvCyvflgwm3rRGt53jhEuXCEQSwQLsrZjBRA3Y4ZEfw';\n/* ---- Backend schema assumptions (adjust column names here if your tables differ) ----\n   beta_profiles          (id uuid = auth user id, crypto_key text base64 raw AES-256 key)\n   beta_classes           (id, teacher_id, name)\n   beta_students          (id, class_id, teacher_id, encrypted_name text base64, iv text base64)\n   beta_student_xp        (id, student_id, daily int, cum int, is_leader bool, updated_at)\n   beta_leadership_groups (id, class_id, name, member_ids jsonb, locked bool)\n   Google sign-in runs through Supabase Auth's Google provider — enable it in the\n   Supabase dashboard (Authentication → Providers) with your OAuth client\n   893792288234-g55rne01l930c06kac13qk85ot5oabud.apps.googleusercontent.com\n   and redirect URL https://qeigivfzyjitxgsrngkr.supabase.co/auth/v1/callback. */\nconst TBL = { profiles: 'beta_profiles', classes: 'beta_classes', students: 'beta_students', xp: 'beta_student_xp', groups: 'beta_leadership_groups' };\nconst SESSION_CACHE_KEY = 'bfb-leadership-cache-v1';\nfunction b64ToBuf(b64) { const bin = atob(b64); const buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i); return buf.buffer; }\nfunction bufToB64(buf) { let bin = ''; const bytes = new Uint8Array(buf); for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); }\nasync function importTeacherKey(b64Key) { return crypto.subtle.importKey('raw', b64ToBuf(b64Key), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']); }\nasync function decryptName(key, encryptedB64, ivB64) {\n  try { const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(ivB64) }, key, b64ToBuf(encryptedB64)); return new TextDecoder().decode(pt); }\n  catch (e) { return '[unable to decrypt]'; }\n}\nasync function encryptName(key, plainName) {\n  const iv = crypto.getRandomValues(new Uint8Array(12));\n  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plainName));\n  return { encrypted_name: bufToB64(ct), iv: bufToB64(iv.buffer) };\n}\nconst ALARM_LABELS = { bell: 'School bell', chime: 'Soft chime', clock: 'Alarm clock', gong: 'Gong' };\nconst ALARM_MS = { bell: 2600, chime: 2200, clock: 2200, gong: 3400 };\nconst THEME_COLORS = [\n  { name: 'Amber', hex: '#F7C24B' }, { name: 'Orange', hex: '#E8951F' }, { name: 'Red', hex: '#C9402F' },\n  { name: 'Coral', hex: '#E2622C' }, { name: 'Gold', hex: '#D8B215' }, { name: 'Olive', hex: '#A8B520' },\n  { name: 'Green', hex: '#5FA02A' }, { name: 'Forest', hex: '#2E8B5E' }, { name: 'Teal', hex: '#12977F' },\n  { name: 'Sky', hex: '#1B8FA8' }, { name: 'Blue', hex: '#2C6BAF' }, { name: 'Indigo', hex: '#5B6FD8' },\n  { name: 'Violet', hex: '#9B6FD8' }, { name: 'Magenta', hex: '#C15FC0' }, { name: 'Pink', hex: '#D85FA0' },\n  { name: 'Slate', hex: '#8A9689' }\n];\nconst POSITIVE_NOTES = ['Great job!', 'Awesome work!', 'Keep it up!', 'Fantastic effort!', 'Way to go!'];\nconst NEGATIVE_NOTES = ['Maybe next time.', \"Let's bounce back tomorrow.\", 'Everyone has an off day.', 'Small steps forward.'];\nfunction feedbackFor(delta) {\n  if (delta > 0) return POSITIVE_NOTES[Math.abs(delta) % POSITIVE_NOTES.length];\n  if (delta < 0) return NEGATIVE_NOTES[Math.abs(delta) % NEGATIVE_NOTES.length];\n  return 'Steady as you go.';\n}\nfunction softTint(hex) {\n  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);\n  const mix = c => Math.round(c * 0.14 + 255 * 0.86);\n  return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';\n}\nfunction bestTextOn(hex) {\n  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);\n  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#17251C' : '#FFFFFF';\n}\nconst AI_PROMPT = 'Convert the student roster below into this exact JSON format. Keep class names as given. Do not add extra fields. Output ONLY the JSON, nothing else:\\n\\n{\\n  \"classes\": [\\n    {\\n      \"className\": \"Period 3\",\\n      \"students\": [\"John Smith\", \"Maria Garcia\", \"Alex Chen\"]\\n    }\\n  ]\\n}\\n\\nRoster to convert:\\n[PASTE ROSTER HERE]';\nconst FORMAT_EXAMPLE = '{\\n  \"classes\": [\\n    {\\n      \"className\": \"Period 3\",\\n      \"students\": [\"First Last\", \"First Last\", \"First Last\"]\\n    },\\n    {\\n      \"className\": \"Period 5\",\\n      \"students\": [\"First Last\", \"First Last\"]\\n    }\\n  ]\\n}';\nconst STEPS = { '+5 / +10': [5,10], '+1 / +5': [1,5], '+10 / +25': [10,25] };\nconst SIZES = { S: { title: 15, intro: 10, body: 10.5, tiny: 8, box: 11 }, M: { title: 19, intro: 12, body: 13, tiny: 9.5, box: 13 }, L: { title: 25, intro: 14.5, body: 16, tiny: 11, box: 16 } };\nconst PRINT_GRID = { 1: '1fr', 2: '1fr', 3: '1fr', 4: '1fr 1fr', 6: '1fr 1fr' };\nconst PRINT_ROWS = { 1: '1fr', 2: '1fr 1fr', 3: '1fr 1fr 1fr', 4: '1fr 1fr', 6: '1fr 1fr 1fr' };\n\n/* Real rosters now come from Supabase (beta_classes/beta_students, names encrypted) — nothing hardcoded here. */\n\nconst TEAM_ADJ = ['Fearless','Thunderous','Relentless','Blazing','Cunning','Untamed','Vigilant','Ironclad','Storming','Tenacious','Daring','Steadfast','Electric','Ferocious','Unshaken','Roaring','Cloudborne','Riverwise','Nightbound','Sunlit','Boundless','Mighty','Clever','Fearsome','Radiant','Swift','Bold','Lionhearted','Wildfire','Emerald'];\nconst TEAM_ANIMAL = ['Jaguars','Toucans','Macaws','Anacondas','Tapirs','Ocelots','Capybaras','Harpy Eagles','Dart Frogs','Kinkajous','Howler Monkeys','Iguanas','Caimans','Coatis','Margays','Tamarins','Boas','Quetzals','Sloths','Peccaries','Piranhas','Jacamars','Agoutis','Bullfrogs','Anteaters','Pumas','Parakeets','Geckos','Toads','Hornbills'];\n\nfunction shuffled(list) {\n  const a = list.slice();\n  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }\n  return a;\n}\n\nfunction titleWord(w) { return w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : ''; }\n/* \"Ponnapa Reddy, Rishaan Kumar\" -> \"Rishaan P.\" */\nfunction shortName(raw) {\n  const parts = String(raw || '').split(',');\n  if (parts.length < 2) return String(raw || '').trim();\n  const surname = parts[0].trim().split(/\\s+/)[0] || '';\n  const given = parts[1].trim().split(/\\s+/)[0] || '';\n  if (!given) return titleWord(surname);\n  return titleWord(given) + (surname ? ' ' + surname.charAt(0).toUpperCase() + '.' : '');\n}\n/* Fresh set every call; never repeats a pairing used in the previous set. */\nfunction teamNames(n, avoid) {\n  const used = {};\n  (avoid || []).forEach(s => { used[String(s).replace(/^\\d+\\s*\\u00b7\\s*/, '')] = true; });\n  const adj = shuffled(TEAM_ADJ), an = shuffled(TEAM_ANIMAL), out = [];\n  for (let i = 0; i < n; i++) {\n    let pair = '';\n    for (let tries = 0; tries < 40; tries++) {\n      pair = adj[Math.floor(Math.random() * adj.length)] + ' ' + an[Math.floor(Math.random() * an.length)];\n      if (!used[pair]) break;\n    }\n    used[pair] = true;\n    out.push((i + 1) + ' \\u00b7 ' + pair);\n  }\n  return out;\n}\n\nconst HEADER_H = 132;\nfunction headerH() {\n  try { const h = document.querySelector('header'); return h ? Math.round(h.getBoundingClientRect().height) + 12 : HEADER_H; }\n  catch (e) { return HEADER_H; }\n}\nfunction today() { return new Date().toISOString().slice(0, 10); }\nfunction firstName(n) { return (n || '').trim().split(/\\s+/)[0].toLowerCase(); }\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = this.restore();\n    this.toastTimer = null;\n    this.drag = null;\n    this.chimeLeft = 0;\n    this.chimeTimer = null;\n    this.alarmTimer = null;\n    this.undoStack = [];\n    this.pendingSync = {};\n  }\n\n  async initBackend() {\n    if (!(window.supabase && window.supabase.createClient)) {\n      this.setState({ authStatus: 'signedOut', syncStatus: 'error', syncError: 'Supabase client library failed to load.' });\n      return;\n    }\n    this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);\n    this.sb.auth.onAuthStateChange((_evt, session) => this.handleSession(session));\n    const { data } = await this.sb.auth.getSession();\n    this.handleSession(data && data.session);\n  }\n\n  async handleSession(session) {\n    if (!session) { this.setState({ authStatus: 'signedOut', user: null }); this.teacherKey = null; return; }\n    this.setState({ authStatus: 'signedIn', user: session.user, syncStatus: 'connecting' });\n    await this.loadTeacherKey(session.user.id);\n    await this.loadEverything();\n  }\n\n  signIn = () => { this.sb && this.sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }); };\n  signOut = () => { this.sb && this.sb.auth.signOut(); try { sessionStorage.removeItem(SESSION_CACHE_KEY); } catch (e) {} this.setState(this.blank()); };\n\n  async loadTeacherKey(userId) {\n    try {\n      const { data, error } = await this.sb.from(TBL.profiles).select('crypto_key').eq('id', userId).single();\n      if (error) throw error;\n      if (!data || !data.crypto_key) throw new Error('missing key');\n      this.teacherKey = await importTeacherKey(data.crypto_key);\n    } catch (e) {\n      this.teacherKey = null;\n      this.setState({ syncStatus: 'error', syncError: 'Could not load your encryption key from beta_profiles.crypto_key \\u2014 student names can\\u2019t be decrypted.' });\n    }\n  }\n\n  async loadEverything() {\n    if (!this.sb || !this.state.user) return;\n    try {\n      const { data: dbClasses, error: ce } = await this.sb.from(TBL.classes).select('id,name').eq('teacher_id', this.state.user.id).order('name');\n      if (ce) throw ce;\n      const classesOut = [];\n      for (let i = 0; i < (dbClasses || []).length; i++) {\n        const dc = dbClasses[i];\n        const { data: students, error: se } = await this.sb.from(TBL.students).select('id,encrypted_name,iv').eq('class_id', dc.id);\n        if (se) throw se;\n        const ids = (students || []).map(s => s.id);\n        let xpRows = [];\n        if (ids.length) {\n          const { data: xp } = await this.sb.from(TBL.xp).select('student_id,daily,cum,is_leader').in('student_id', ids);\n          xpRows = xp || [];\n        }\n        const xpById = {};\n        xpRows.forEach(r => { xpById[r.student_id] = r; });\n        const decrypted = [];\n        for (let k = 0; k < (students || []).length; k++) {\n          const s = students[k];\n          const name = this.teacherKey ? await decryptName(this.teacherKey, s.encrypted_name, s.iv) : '[locked]';\n          const x = xpById[s.id] || {};\n          decrypted.push({ id: s.id, name, daily: x.daily || 0, cum: x.cum || 0, leader: !!x.is_leader, badges: [], conflicts: [], lock: null, dot: k % 6 });\n        }\n        classesOut.push({ id: dc.id, name: dc.name, color: CLS_COLORS[i % CLS_COLORS.length], students: decrypted });\n      }\n      const checked = {};\n      classesOut.forEach(c => { checked[c.id] = true; });\n      this.setState({ classes: classesOut, checked, activeIdx: 0, syncStatus: 'online', syncError: '', showPaste: classesOut.length === 0 });\n    } catch (e) {\n      this.setState({ syncStatus: 'error', syncError: 'Could not load classes/students from Supabase \\u2014 check beta_classes and beta_students table columns.' });\n    }\n  }\n\n  async pushImportedToSupabase(out) {\n    if (!this.sb || !this.state.user || !this.teacherKey) { this.flash('Saved locally only \\u2014 sign in with a working encryption key to sync to the cloud'); return; }\n    this.setState({ syncStatus: 'syncing' });\n    try {\n      for (const c of out) {\n        let classId;\n        const { data: existing } = await this.sb.from(TBL.classes).select('id').eq('teacher_id', this.state.user.id).eq('name', c.name).maybeSingle();\n        if (exi
